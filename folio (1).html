<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Folio Builder · Higher English</title>
<meta name="theme-color" content="#14213d">
<style>
:root{
  --ink:#14213d; --ink2:#3b4660; --muted:#6b7385; --line:#dfe3ea; --bg:#f6f7f9; --card:#fff;
  --accent:#e0a526; --accent2:#fff4d9; --good:#1f8a5b; --goodbg:#e4f5ec; --bad:#b93a32; --badbg:#fbe9e7;
  --blue:#2a5bd7; --bluebg:#e8eefc; --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--ink);color:#fff;padding:14px 18px 12px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px;letter-spacing:.2px}
header p{margin:2px 0 0;font-size:13px;color:#c9cfdb}
main{max-width:760px;margin:0 auto;padding:16px 14px 110px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 2px 8px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button .ic{font-size:19px;line-height:1}
nav button.on{color:var(--ink);font-weight:700}
nav button.on .ic{transform:scale(1.1)}
h2{font-size:21px;margin:6px 0 4px}
h3{font-size:16px;margin:18px 0 6px}
.sub{color:var(--muted);margin:0 0 14px;font-size:14.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.rule{background:var(--accent2);border:1px solid #f0d58f;border-radius:var(--r);padding:12px 14px;margin:0 0 14px;font-size:14.5px}
.rule b{color:#7a5300}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--bluebg);color:var(--blue);margin:0 4px 4px 0}
.tag.gold{background:var(--accent2);color:#7a5300}
.tag.grey{background:#eef0f4;color:var(--ink2)}
label{display:block;font-weight:600;font-size:14.5px;margin:0 0 6px}
textarea,input[type=text],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
textarea:focus,input:focus,select:focus{outline:2px solid var(--blue);outline-offset:0;border-color:transparent}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:10px 14px;font:600 14.5px/1 inherit;font-family:inherit;cursor:pointer;background:var(--ink);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--accent);color:var(--ink)}
.btn.small{padding:7px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 0 12px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font:600 13.5px inherit;font-family:inherit;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.q{font-weight:650;margin:0 0 4px}
.hint{color:var(--muted);font-size:13.5px;margin:0 0 8px}
.saved{font-size:12px;color:var(--good);opacity:0;transition:opacity .3s}
.saved.show{opacity:1}
.fact{display:flex;gap:10px;align-items:flex-start}
.fact .star{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;padding:0 2px;color:#c5cad4}
.fact .star.on{color:var(--accent)}
.fact .txt{flex:1}
.fact .src{font-size:12.5px;color:var(--muted);margin-top:4px}
.flag{font-size:12.5px;color:#7a5300;background:var(--accent2);border-radius:6px;padding:2px 6px;display:inline-block;margin-top:4px}
.pt{border-left:4px solid var(--accent)}
.pt .num{font-weight:800;color:var(--accent);font-size:13px;letter-spacing:.5px}
.linkbox{margin:-4px 0 12px 18px;border-left:2px dashed #c5cad4;padding:6px 0 6px 14px}
.linkbox textarea{min-height:52px;font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink2)}
.chip.on{background:var(--bluebg);border-color:#b9c9f3;color:var(--blue);font-weight:600}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;margin:0 0 8px;font:inherit;cursor:pointer;color:var(--ink)}
.opt.right{background:var(--goodbg);border-color:#9fd6b9}
.opt.wrong{background:var(--badbg);border-color:#efb3ad}
.fb{border-radius:10px;padding:10px 12px;font-size:14.5px;margin:6px 0 0}
.fb.good{background:var(--goodbg)}
.fb.bad{background:var(--badbg)}
.big{font-size:17px;font-weight:600;line-height:1.45}
.example{background:#f3f5f9;border-radius:10px;padding:10px 12px;font-style:italic;margin:6px 0}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px}
.meter{height:8px;background:#eef0f4;border-radius:99px;overflow:hidden;margin:6px 0 2px}
.meter i{display:block;height:100%;background:var(--good);width:0}
details{border:1px solid var(--line);border-radius:12px;background:#fff;margin:0 0 10px}
summary{padding:12px 14px;font-weight:650;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";float:right;color:var(--muted)}
details[open] summary::after{content:"－"}
details .in{padding:0 14px 12px}
ul.tight{margin:6px 0;padding-left:20px}
ul.tight li{margin:3px 0}
.empty{text-align:center;color:var(--muted);padding:22px 10px;border:1px dashed var(--line);border-radius:var(--r);background:#fff}
.score{font-weight:700}
.print-only{display:none}
@media print{
  header,nav,.no-print{display:none!important}
  .print-only{display:block}
  body{background:#fff}
  main{padding:0;max-width:none}
  .card{border:1px solid #bbb;break-inside:avoid}
  .screen{display:none!important}
  #view-pack{display:block!important}
}
</style>
</head>

  <div class="rule"><b>How to use this:</b> read it for the <i>qualities</i>: how it hooks the reader, builds the argument in steps, handles the other side fairly and ends. Don't copy its order, phrases or examples. Your evidence is different and needs its own shape, and your piece has to be in your own words.</div>

  <h3>The marking grid in plain English</h3>
  <div class="card">

      <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13.5px">

      ${g.a.map((x,i)=>`<tr><td style="padding:6px;border-top:1px solid var(--line);vertical-align:top"><b>${esc(x)}</b></td><td style="padding:6px;border-top:1px solid var(--line);vertical-align:top">${esc(g.b[i])}</td><td style="padding:6px;border-top:1px solid var(--line);vertical-align:top">${esc(g.c[i])}</td></tr>`).join("")}
      </table></div>`).join("")}
    <p class="hint" style="margin-top:10px">The jump from B to A is mostly in the words <b>strong</b>, <b>skilful</b>, <b>sustained</b> and <b>confident</b>. It isn't more techniques. It's evidence chosen and discussed, an argument that builds instead of listing, and the other side dealt with properly.</p>
  </div>

  <h3>The same point at three levels</h3>
  ${LEVELS.map(l=>`<div class="card">
    <span class="tag ${l.cls==='good'?'':'grey'}" ${l.cls==='good'?'style="background:var(--goodbg);color:var(--good)"':''}>${esc(l.band)}</span>

  </div>
  <details><summary>Research only you can do</summary><div class="in"><ul class="tight">
    <li>Ask your coach how often scouts come to games, and who from the area has been picked up.</li>
    <li>Ask the Scottish FA South West development team how scouting covers the region: southwest@scottishfa.co.uk</li>
    <li>Check on Google Maps how far it is from Lockerbie to Kilmarnock, Motherwell and Glasgow, by car and by bus or train.</li>
  </ul><p class="hint">Write down who said what and when. Add it above with its source.</p></div></details>`;
}

function viewBuild(){
  const cards = S.cards;
  return `
  <h2>Build your argument</h2>
  <p class="sub">Make one card per idea, in your own words. Use the arrows to try different orders until it flows. Between each card, note how you'll get from one to the next.</p>
  <div class="row" style="margin-bottom:12px"><span id="savedFlag" class="saved">Saved ✓</span><span class="spacer"></span><button class="btn gold" onclick="addCard()">＋ Add a card</button></div>
  ${cards.length?cards.map((c,i)=>`
    <div class="card pt">
      <div class="row"><span class="num">CARD ${i+1}</span><span class="spacer"></span>
        <button class="btn ghost small" onclick="moveCard(${i},-1)" ${i===0?'disabled':''} aria-label="Move up">↑</button>
        <button class="btn ghost small" onclick="moveCard(${i},1)" ${i===cards.length-1?'disabled':''} aria-label="Move down">↓</button>
        <button class="btn ghost small" onclick="delCard(${i})" aria-label="Delete">✕</button></div>
      <label style="margin-top:8px">The idea, in one line</label>
      <input type="text" data-card="${i}" data-f="point" value="${esc(c.point)}" placeholder="Your idea in a few words">
      <label style="margin-top:10px">Why should the reader care?</label>
      <textarea data-card="${i}" data-f="why" placeholder="Your notes…">${esc(c.why)}</textarea>
      <label style="margin-top:10px">Evidence <span class="hint" style="font-weight:400">(from your starred facts)</span></label>
      ${S.starred.length?`<div class="chips">${S.starred.map(fid=>{const f=factById(fid); if(!f) return ""; const on=c.evidence.includes(fid); return `<button class="chip ${on?'on':''}" onclick="toggleEv(${i},'${fid}')">${esc(f.t.slice(0,52))}${f.t.length>52?'…':''}</button>`;}).join("")}</div>`:`<p class="hint">Star some facts in Evidence first.</p>`}
      <label style="margin-top:10px">Technique(s) you might use</label>
      <div class="chips">${TECHNIQUES.map(t=>`<button class="chip ${c.tech.includes(t.id)?'on':''}" onclick="toggleTech(${i},'${t.id}')">${esc(t.n)}</button>`).join("")}</div>
    </div>
    ${i<cards.length-1?`<div class="linkbox"><label style="font-size:13.5px">↓ How does card ${i+1} lead into card ${i+2}?</label><textarea data-card="${i}" data-f="link" placeholder="e.g. adding a stronger point? turning to the other side? Note it in your words.">${esc(c.link)}</textarea></div>`:""}
  `).join(""):`<div class="empty">No cards yet. Start with whatever idea feels strongest – you can reorder later.</div>`}
  ${cards.length>=2?`
  <h3>Check it like a marker</h3>
  <div class="card">
    <p class="hint">General questions for any persuasive essay. Answer them honestly – you decide what to change.</p>
    <ul class="tight">
      <li>Will the reader know which side you're on early?</li>
      <li>Is there a card where you deal with what the other side would say?</li>
      <li>Does each card move the argument on, or do two say the same thing?</li>
      <li>Is your strongest evidence somewhere it will land hard?</li>
      <li>Do the links show <i>why</i> one idea leads to the next, not just 'also'?</li>
      <li>Does the end leave the reader with something to think or do?</li>
    </ul>
    <div class="row" style="margin-top:8px"><button class="btn" onclick="readThrough()">Read the flow out loud ▶</button></div>
  </div>
  <div id="flow"></div>`:""}
  ${viewTitleWorkshop()}`;
}

    ${TITLE_TYPES.map(t=>`<p style="margin:0 0 6px"><b>${esc(t.n)}</b><br><span class="hint" style="font-style:italic">${esc(t.ex)}</span></p>`).join("")}

let linkI=0, linkPicked=null;
function viewLinks(){
  const d=LINK_DRILL[linkI];
  const [r,tot]=S.stats.links;
  return `
  <h3 style="margin-top:0">Linking phrases by job</h3>
  <p class="hint">Pick the phrase for the job the sentence is doing. 'Also' and 'another point is' are the weakest links – a marker notices.</p>
  ${LINKS.map(l=>`<details><summary>${esc(l.f)}</summary><div class="in"><div class="chips">${l.p.map(p=>`<span class="chip">${esc(p)}</span>`).join("")}</div></div></details>`).join("")}
  <h3>Link drill <span class="hint" style="font-weight:400">${tot?`· ${r}/${tot} right so far`:""}</span></h3>
  <div class="card">
    <p class="hint">Which link joins these best?</p>
    <p style="margin:0 0 6px"><b>1.</b> ${esc(d.a)}</p>
    <p style="margin:0 0 12px"><b>2.</b> <span style="color:var(--muted)">[ ___ ]</span> ${esc(d.b.charAt(0).toLowerCase()+d.b.slice(1))}</p>
    ${d.opts.map((o,i)=>{let cls=""; if(linkPicked!==null){ if(i===d.c) cls="right"; else if(i===linkPicked) cls="wrong"; } return `<button class="opt ${cls}" onclick="pickLink(${i})" ${linkPicked!==null?'disabled':''}>${esc(o)}</button>`;}).join("")}
    ${linkPicked!==null?`<div class="fb ${linkPicked===d.c?'good':'bad'}">${linkPicked===d.c?'Right. ':'Not quite. '}${esc(d.why)}</div>
      <div class="row" style="margin-top:10px"><button class="btn" onclick="nextLink()">Next →</button></div>`:""}
  </div>`;
}
function pickLink(i){ linkPicked=i; S.stats.links[1]++; if(i===LINK_DRILL[linkI].c) S.stats.links[0]++; save(); render(); }
function nextLink(){ linkI=(linkI+1)%LINK_DRILL.length; linkPicked=null; render(); }

function viewTech(){
  return `<p class="hint" style="margin-top:0">Examples use rural-sport practice topics. Facts in them are real. In your own piece, every figure must be real and sourced too – never make up evidence.</p>
  ${TECHNIQUES.map(t=>`<details><summary>${esc(t.n)}</summary><div class="in"><p style="margin:0 0 4px">${esc(t.d)}</p><div class="example">${esc(t.ex)}</div></div></details>`).join("")}
  <div class="card"><p class="q">Rule of thumb</p><p style="margin:0">One or two techniques per paragraph, chosen for a reason. A list of techniques bolted on sounds forced. The best persuasive writing uses evidence <i>and</i> feeling, and is fair to the other side before beating it.</p></div>`;
}

let spotOrder=null, spotI=0, spotPicked=null;
function viewSpot(){
  if(!spotOrder){ spotOrder=SPOT.map((_,i)=>i).sort(()=>Math.random()-.5); }
  const item=SPOT[spotOrder[spotI]];
  if(!item._opts){
    const others=TECHNIQUES.filter(t=>t.id!==item.c).sort(()=>Math.random()-.5).slice(0,3).map(t=>t.id);
    item._opts=[item.c].concat(others).sort(()=>Math.random()-.5);
  }
  const [r,tot]=S.stats.spot;
  return `<div class="card">
    <div class="row"><span class="hint">Question ${spotI+1} of ${SPOT.length}</span><span class="spacer"></span>${tot?`<span class="hint">${r}/${tot} right overall</span>`:""}</div>
    <p class="big" style="margin:8px 0 12px">"${esc(item.s)}"</p>
    <p class="hint">Which technique is this mainly using?</p>
    ${item._opts.map(id=>{let cls=""; if(spotPicked!==null){ if(id===item.c) cls="right"; else if(id===spotPicked) cls="wrong"; } return `<button class="opt ${cls}" onclick="pickSpot('${id}')" ${spotPicked!==null?'disabled':''}>${esc(techName(id))}</button>`;}).join("")}
    ${spotPicked!==null?`<div class="fb ${spotPicked===item.c?'good':'bad'}">${spotPicked===item.c?'Right.':'It\'s '+esc(techName(item.c))+'.'} ${esc(TECHNIQUES.find(t=>t.id===item.c).d)}</div>
    <div class="row" style="margin-top:10px"><button class="btn" onclick="nextSpot()">Next →</button></div>`:""}
  </div>`;
}
function pickSpot(id){ spotPicked=id; S.stats.spot[1]++; if(id===SPOT[spotOrder[spotI]].c) S.stats.spot[0]++; save(); render(); }
function nextSpot(){ spotPicked=null; spotI++; if(spotI>=SPOT.length){ spotI=0; spotOrder=null; SPOT.forEach(s=>delete s._opts);} render(); }

let timedTopic=null, timedMins=20;
function viewTimed(){
  return `<div class="card">
    <p style="margin:0 0 8px">Practise getting words down at pace on a <b>practice topic</b>: opener, at least two linked paragraphs, one counter-argument. Use the Build habit – jot 3–4 card ideas first, then write.</p>
    ${timedTopic?`
      <p class="big" style="margin:6px 0">${esc(timedTopic)}</p>
      <div class="row"><span class="timer" id="tt">${timedMins}:00</span><span class="spacer"></span><span class="hint" id="twc">0 words</span></div>
      <textarea id="timedText" style="min-height:260px" oninput="wc('timedText','twc')" placeholder="Plan in 2 minutes, then write…"></textarea>
      <div class="row" style="margin-top:10px"><button class="btn" onclick="finishTimed()">Stop and save</button><button class="btn ghost" onclick="timedTopic=null;stopTimer();render()">Cancel</button></div>
      <div id="timedDone"></div>`:`
      <label for="tmins">Time</label>
      <select id="tmins" onchange="timedMins=+this.value"><option value="10">10 minutes</option><option value="20" selected>20 minutes</option><option value="40">40 minutes</option></select>
      <div class="row" style="margin-top:10px"><button class="btn gold" onclick="startTimed()">Give me a topic</button></div>`}

function startTimed(){ timedTopic=PRACTICE_TOPICS[Math.floor(Math.random()*PRACTICE_TOPICS.length)]; render(); startTimer(timedMins*60,"tt",()=>finishTimed()); }
function finishTimed(){
  stopTimer(); const t=document.getElementById("timedText"); if(!t) return;
  const words=(t.value.trim().match(/\S+/g)||[]).length;
  if(words){ S.practice.push({kind:"timed",topic:timedTopic,text:t.value.trim(),d:Date.now()}); save(); }
  document.getElementById("timedDone").innerHTML=`<div class="fb good">Saved – ${words} words. Now reread it: is your side clear early? Did you use at least one counter-argument? Circle every 'also' and swap it for a stronger link.</div>`;
}

function viewPack(){
  const ans=BRAINSTORM.filter(b=>(S.answers[b.id]||"").trim());
  const starred=S.starred.map(factById).filter(Boolean);
  const srcKeys=[...new Set(starred.filter(f=>!f.mine).map(f=>f.s))];
  const mine=starred.filter(f=>f.mine);
  return `
  <div class="screen"><h2>My pack</h2>
  <p class="sub">Everything you've written plus your starred facts and references, ready to print for the open-book session.</p>
  <div class="rule"><b>Check first:</b> ask Mrs Tyler exactly what you can bring in – notes, a plan, a page limit. Print only what's allowed. Nothing here is pre-written essay text, and it shouldn't become that.</div>
  <div class="row no-print" style="margin-bottom:14px"><button class="btn gold" onclick="window.print()">🖨️ Print / save as PDF</button><button class="btn ghost" onclick="exportData()">Back up my work</button><button class="btn ghost" onclick="importData()">Restore</button></div></div>
  <div class="print-only"><h2>Folio notes</h2></div>

  ${S.titles.length?`<div class="card"><h3 style="margin-top:0">Title ideas</h3>${S.titleFav!==null&&S.titles[S.titleFav]?`<p style="margin:0 0 6px"><b>★ ${esc(S.titles[S.titleFav])}</b></p>`:""}<p class="hint" style="margin:0">${S.titles.filter((_,i)=>i!==S.titleFav).map(esc).join(" · ")}</p></div>`:""}
  <div class="card"><h3 style="margin-top:0">My idea cards (in order)</h3>
  ${S.cards.length?S.cards.map((c,i)=>`<div style="margin:0 0 10px"><b>${i+1}. ${esc(c.point||"(no title)")}</b>
    ${c.why?`<div>${esc(c.why)}</div>`:""}
    ${c.evidence.length?`<div class="hint">Evidence: ${c.evidence.map(id=>{const f=factById(id); return f?esc(f.t.slice(0,70))+(f.t.length>70?"…":""):"";}).join(" · ")}</div>`:""}
    ${c.tech.length?`<div class="hint">Techniques: ${c.tech.map(techName).join(", ")}</div>`:""}
    ${c.link&&i<S.cards.length-1?`<div class="hint">↓ Link: ${esc(c.link)}</div>`:""}</div>`).join(""):`<p class="hint">No cards yet – use Build.</p>`}
  </div>

  <div class="card"><h3 style="margin-top:0">My thinking</h3>
  ${ans.length?ans.map(b=>`<div style="margin:0 0 8px"><b>${esc(b.q)}</b><div>${esc(S.answers[b.id])}</div></div>`).join(""):`<p class="hint">Nothing yet – use Ideas.</p>`}
  ${S.notes.trim()?`<div><b>My own notes</b><div style="white-space:pre-wrap">${esc(S.notes)}</div></div>`:""}
  </div>

  <div class="card"><h3 style="margin-top:0">Facts I might use</h3>
  ${starred.length?`<ol style="padding-left:20px;margin:0">${starred.map(f=>`<li style="margin:0 0 6px">${esc(f.t)} <span class="hint">[${f.mine?esc(f.src||"own research"):esc(SOURCES[f.s].t.split(" (")[0].split(".")[0])}]</span></li>`).join("")}</ol>`:`<p class="hint">Star facts in Evidence.</p>`}
  </div>

  <div class="card"><h3 style="margin-top:0">References</h3>
  ${srcKeys.length||mine.length?`<ol style="padding-left:20px;margin:0">${srcKeys.map(k=>`<li style="margin:0 0 6px">${esc(SOURCES[k].t)} ${esc(SOURCES[k].u)}</li>`).join("")}${mine.filter(f=>f.src).map(f=>`<li style="margin:0 0 6px">${esc(f.src)}</li>`).join("")}</ol>`:`<p class="hint">Your references appear here when you star facts.</p>`}
  </div>

  <div class="card"><h3 style="margin-top:0">Technique checklist</h3>
  <p style="margin:0">${TECHNIQUES.map(t=>esc(t.n)).join(" · ")}</p></div>`;

/* ============ ACTIONS ============ */

function toggleStar(id){ const i=S.starred.indexOf(id); if(i>-1) S.starred.splice(i,1); else S.starred.push(id); save(); render(); }
function addFact(){
  const t=document.getElementById("nf").value.trim(), s=document.getElementById("ns").value.trim();
  if(!t) return;
  const id="m"+uid(); S.myFacts.push({id,t,src:s}); S.starred.push(id); save(); factFilter="mine"; render();
}
function delFact(id){ if(!confirm("Remove this fact?")) return; S.myFacts=S.myFacts.filter(f=>f.id!==id); S.starred=S.starred.filter(x=>x!==id); S.cards.forEach(c=>c.evidence=c.evidence.filter(x=>x!==id)); save(); render(); }
function addCard(){ S.cards.push({id:uid(),point:"",why:"",evidence:[],tech:[],link:""}); save(); render(); setTimeout(()=>{const els=document.querySelectorAll('input[data-f="point"]'); if(els.length) els[els.length-1].focus();},50); }
function moveCard(i,d){ const j=i+d; if(j<0||j>=S.cards.length) return; [S.cards[i],S.cards[j]]=[S.cards[j],S.cards[i]]; save(); render(); }
function delCard(i){ if(!confirm("Delete this card?")) return; S.cards.splice(i,1); save(); render(); }
function toggleEv(i,fid){ const e=S.cards[i].evidence; const k=e.indexOf(fid); if(k>-1) e.splice(k,1); else e.push(fid); save(); render(); }
function toggleTech(i,tid){ const e=S.cards[i].tech; const k=e.indexOf(tid); if(k>-1) e.splice(k,1); else e.push(tid); save(); render(); }
function addTitle(){ const el=document.getElementById("newTitle"); const v=el.value.trim(); if(!v) return; S.titles.push(v); save(); render(); setTimeout(()=>{const n=document.getElementById("newTitle"); if(n){n.focus(); n.scrollIntoView({block:"center"});}},50); }
function delTitle(i){ S.titles.splice(i,1); if(S.titleFav===i) S.titleFav=null; else if(S.titleFav>i) S.titleFav--; save(); render(); }
function favTitle(i){ S.titleFav = S.titleFav===i?null:i; save(); render(); }
function readThrough(){
  const el=document.getElementById("flow");
  el.innerHTML=`<div class="card"><p class="q">Your argument, start to finish</p>${S.cards.map((c,i)=>`<p style="margin:0 0 6px"><b>${i+1}.</b> ${esc(c.point||"(empty)")}</p>${c.link&&i<S.cards.length-1?`<p class="hint" style="margin:0 0 6px 16px">↓ ${esc(c.link)}</p>`:""}`).join("")}
  <p class="hint" style="margin-top:10px">Say it out loud. Wherever you stumble or the link feels like 'and another thing', that's the join to rethink.</p></div>`;
  el.scrollIntoView({behavior:"smooth"});
}
function wc(src,out){ const n=(document.getElementById(src).value.trim().match(/\S+/g)||[]).length; document.getElementById(out).textContent=n+" words"; }
function startTimer(sec,elId,done){
  stopTimer(); timerLeft=sec;
  const tick=()=>{ const el=document.getElementById(elId); if(!el){stopTimer();return;} const m=Math.floor(timerLeft/60), s=timerLeft%60; el.textContent=m+":"+String(s).padStart(2,"0"); if(timerLeft<=0){ stopTimer(); el.textContent="Time!"; done&&done(); } timerLeft--; };
  tick(); timerInt=setInterval(tick,1000);
}
function stopTimer(){ if(timerInt){clearInterval(timerInt); timerInt=null;} }
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="folio-builder-backup.json"; a.click();
}
function importData(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d&&typeof d==="object"&&d.answers){ S=Object.assign(S,d); save(); render(); alert("Restored."); } else alert("That file doesn't look like a Folio Builder backup."); }catch(e){ alert("Couldn't read that file."); } }; r.readAsText(f); };
  inp.click();
}

/* ============ RENDER ============ */

function render(){
  if(tab!=="skills") stopTimer();
  const v={plan:viewPlan,facts:viewFacts,build:viewBuild,skills:viewSkills,example:viewExample,pack:viewPack}[tab]();
  document.getElementById("app").innerHTML=`<div id="view-${tab}">${v}</div>`;
  renderNav();
}
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.ans){ S.answers[t.dataset.ans]=t.value; save(); }
  else if(t.hasAttribute("data-notes")){ S.notes=t.value; save(); }
  else if(t.dataset.tans){ S.titleAns[t.dataset.tans]=t.value; save(); }
  else if(t.dataset.card!==undefined && t.dataset.f){ const c=S.cards[+t.dataset.card]; if(c){ c[t.dataset.f]=t.value; save(); } }
});
render();
</script>
</body>
