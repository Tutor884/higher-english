/* ---------- shared question card ---------- */
function questionCard(q, skill, context, textName){
  const c = el(`<div class="qcard">
    <div class="qhead">${pill(skill)}<span class="tiny">Question ${q.n}</span><span class="marks">${q.marks} mark${q.marks>1?'s':''}</span></div>
    <div class="qbody stack">
      <p style="font-size:16px;line-height:1.5;font-weight:500">${esc(q.q)}</p>
      ${q.hint?`<p class="tiny">${esc(q.hint)}</p>`:''}
      <textarea class="answer" placeholder="${q.marks>=10?'Bullet points are allowed here. One scoring comment per bullet.':'Quote, name the technique, then explain the effect.'}"></textarea>
      <div class="row"><span class="wordcount">0 words</span></div>
      <div class="slot stack-s"></div>
    </div></div>`);
  const ta = c.querySelector('textarea'), wc = c.querySelector('.wordcount'), slot = c.querySelector('.slot');
  ta.addEventListener('input', () => { const n = ta.value.trim().split(/\s+/).filter(Boolean).length; wc.textContent = n + ' words'; });

  const row = el(`<div class="row" style="gap:8px"></div>`);
  const aiBtn = el(`<button class="btn brass" style="flex:1" data-ai-gate>Mark my answer</button>`);
  const showBtn = el(`<button class="btn secondary" style="flex:1">Model answer</button>`);
  aiBtn.hidden = !SAMPLE;
  row.appendChild(aiBtn); row.appendChild(showBtn); slot.appendChild(row);

  showBtn.onclick = () => {
    showBtn.disabled = true;
    slot.appendChild(el(`<div class="fb"><h4>Answers that would score</h4><ul>${q.model.map(m=>`<li>${esc(m)}</li>`).join('')}</ul>
      <p class="tiny" style="margin-top:8px">You do not need all of these — only enough comments to reach ${q.marks} mark${q.marks>1?'s':''}.</p></div>`));
    slot.appendChild(selfMark(q.marks, skill, null));
  };
  aiBtn.onclick = async () => {
    if(!ta.value.trim()){ toast('Write something first'); return; }
    aiBtn.disabled = true;
    const out = el(`<div class="fb"><h4>Marking</h4><p class="sub">Reading your answer…</p></div>`);
    slot.appendChild(out);
    try{
      const r = await mark({
        kind: q.marks>=10 ? 'Higher English Scottish text 10-mark commonality question on ' + textName
                          : 'Higher English ' + (skill==='ruae'?'RUAE':'Scottish text') + ' question on ' + textName,
        question:q.q, marks:q.marks, context:(context||'').slice(0,4000),
        model:q.model.join(' | '), answer:ta.value });
      out.remove(); slot.appendChild(feedbackCard(r, q.marks, skill, q.q));
      S.marks.push({ d:today(), s:skill, m:Math.min(q.marks,Number(r.mark)||0), of:q.marks, q:textName + ' Q' + q.n }); save();
      touchStreak(); paintStreak();
      aiBtn.textContent='Mark again'; aiBtn.disabled=false;
    }catch(e){
      out.remove(); const msg = aiErrCopy(e.code);
      if(msg) slot.appendChild(el(`<div class="fb"><h4>Could not mark</h4><p style="font-size:14.5px">${esc(msg)}</p></div>`));
      aiBtn.disabled=false;
      if(e.code==='not_granted'||e.code==='sampling_disabled') aiBtn.hidden = true;
    }
  };
  return c;
}

/* ============================================================
   TEXTS
   ============================================================ */
let textTab = 'jekyll', themeFilter = 'all';
function viewTexts(){
  const wrap = document.createElement('div'); wrap.className='stack';
  wrap.appendChild(el(`<div><div class="eyebrow">Your two texts</div><h1 class="h-page">Quotations, with something to say about them</h1>
    <p class="sub">A quotation alone is worth nothing. Each of these comes with the comment that turns it into marks.</p></div>`));

  const tabs = el(`<div class="chips"></div>`);
  [['jekyll','Jekyll and Hyde — Section 1'],['hamlet','Hamlet — Section 2']].forEach(([k,l])=>{
    const b = el(`<button class="chip" aria-pressed="${textTab===k}">${l}</button>`);
    b.onclick = () => { textTab=k; themeFilter='all'; render(); }; tabs.appendChild(b);
  });
  wrap.appendChild(tabs);

  // themes
  const th = THEMES[textTab];
  const tg = el(`<div><div class="eyebrow" style="margin-bottom:8px">Themes, with references ready to go</div><div class="stack-s"></div></div>`);
  const ts = tg.querySelector('.stack-s');
  th.forEach(t => ts.appendChild(el(`<details class="acc"><summary>${esc(t.name)}</summary>
    <div class="accbody"><p style="margin-bottom:8px"><strong>${esc(t.line)}</strong></p>
    <ul style="margin:0;padding-left:18px">${t.refs.map(r=>`<li style="margin:5px 0">${esc(r)}</li>`).join('')}</ul></div></details>`)));
  wrap.appendChild(tg);

  // quotes
  const qs = QUOTES[textTab];
  const themes = ['all', ...Array.from(new Set(qs.map(q=>q.theme)))];
  const fc = el(`<div class="chips"></div>`);
  themes.forEach(t => {
    const b = el(`<button class="chip" aria-pressed="${themeFilter===t}">${t==='all'?'All quotations':t}</button>`);
    b.onclick = () => { themeFilter = t; render(); }; fc.appendChild(b);
  });
  wrap.appendChild(el(`<div class="eyebrow">Quotation bank</div>`));
  wrap.appendChild(fc);

  const list = qs.filter(q => themeFilter==='all' || q.theme===themeFilter);
  const box = el(`<div class="stack-s"></div>`);
  list.forEach(q => {
    const card = el(`<div class="card">
      <p class="quote">“${esc(q.q)}”</p>
      <p class="tiny" style="margin-top:6px">${esc(q.who)} · ${esc(q.ch)} · ${esc(q.theme)}</p>
      <div class="noteslot"></div></div>`);
    const ns = card.querySelector('.noteslot');
    const b = el(`<button class="btn small secondary" style="margin-top:10px">What to say about it</button>`);
    b.onclick = () => { b.remove(); ns.appendChild(el(`<div class="fb" style="margin-top:10px"><p style="font-size:14.5px;line-height:1.55">${esc(q.note)}</p></div>`)); };
    ns.appendChild(b);
    box.appendChild(card);
  });
  wrap.appendChild(box);
  view.appendChild(wrap);
}

/* ============================================================
   PROGRESS
   ============================================================ */
function viewProgress(){
  const wrap = document.createElement('div'); wrap.className='stack';
  wrap.appendChild(el(`<div><div class="eyebrow">Progress</div><h1 class="h-page">Where the marks are</h1>
    <p class="sub">Confidence moves when you get things right, and moves back when you do not. Work on whatever is lowest.</p></div>`));

  wrap.appendChild(el(`<div class="countdown">
    <div><div class="n">${S.streak}</div><div class="l">day streak</div></div>
    <div><div class="n">${S.drills.done ? Math.round(100*S.drills.right/S.drills.done) + '%' : '—'}</div><div class="l">drill accuracy</div></div>
  </div>`));

  const sk = el(`<div class="card stack-s"><div class="eyebrow">Confidence by skill</div></div>`);
  Object.keys(SKILLS).forEach(k => {
    const v = Math.round(100*(S.conf[k]||0)/5);
    const lessonsDone = LESSONS.filter(l=>l.skill===k && S.lessons[l.id]).length;
    const lessonsAll = LESSONS.filter(l=>l.skill===k).length;
    sk.appendChild(el(`<div style="margin-top:10px">
      <div class="row" style="margin-bottom:5px"><span style="font-weight:600;font-size:14.5px">${esc(SKILLS[k].name)}</span>
        <span style="flex:1"></span><span class="tiny mono-num">${lessonsDone}/${lessonsAll} lessons</span></div>
      <div class="bar ${v>=60?'sage':''}"><i style="width:${Math.max(3,v)}%"></i></div></div>`));
  });
  wrap.appendChild(sk);

  // marks log
  const recent = S.marks.slice(-14).reverse();
  const log = el(`<div><div class="eyebrow" style="margin-bottom:8px">Marks logged</div></div>`);
  if(!recent.length){
    log.appendChild(el(`<div class="card flat"><p class="sub">Nothing yet. Every answer you get marked in Practice lands here, so you can see the shape of the term rather than one bad afternoon.</p></div>`));
  } else {
    const rows = el(`<div class="rows"></div>`);
    recent.forEach(m => rows.appendChild(el(`<div class="rowitem">
      <span class="pill ${SKILLS[m.s]?SKILLS[m.s].cls:'ghost'}">${SKILLS[m.s]?SKILLS[m.s].short:'—'}</span>
      <span class="grow"><span class="t" style="font-size:14px;font-weight:500">${esc(m.q)}</span><span class="d">${esc(m.d)}</span></span>
      <span class="mono-num" style="font-weight:700">${m.m}/${m.of}</span></div>`)));
    log.appendChild(rows);
  }
  wrap.appendChild(log);

  const reset = el(`<button class="btn secondary full">Reset all progress</button>`);
  reset.onclick = () => { if(confirm('Clear streak, lessons and marks on this device?')){ S = fresh(); S.tab='progress'; save(); render(); paintStreak(); } };
  wrap.appendChild(el(`<hr class="rule">`));
  wrap.appendChild(reset);
  wrap.appendChild(el(`<p class="tiny">Progress is stored in this browser only. Opening the app on a different device starts a fresh record.</p>`));
  view.appendChild(wrap);
}

/* ============================================================
   TUTOR SHEET
   ============================================================ */
const TUTOR_RULES = `You are a Higher English tutor in Scotland, working one-to-one with Joss, an S5 pupil at Lockerbie Academy aiming for an A.
His texts: The Strange Case of Dr Jekyll and Mr Hyde (Scottish set text, Section 1, prose) and Hamlet (critical essay, Section 2, drama). He also has weekly RUAE homework and a 30-mark portfolio to write.
Because Jekyll and Hyde is prose, his critical essay must not be prose.
Teach the way a good teacher does: answer the actual question, be concrete, quote the text, and connect everything back to how it earns marks under SQA criteria. Where he asks you to mark something, use real SQA principles - no marks for quotation alone, 1 mark for a basic analytical comment, 2 for a detailed or insightful one, and the 20-mark grid for essays.
Keep replies short enough to read on a phone. Use plain paragraphs and short lists. Never invent quotations - if you are not certain of the wording, describe the moment instead. If he asks about something outside Higher English, answer briefly and steer back.`;

let turns = [];
function openTutor(){
  if(document.querySelector('.sheet')) return;
  const sheet = el(`<div class="sheet">
    <div class="sheethead"><b style="font-family:var(--display);font-size:17px">Ask the tutor</b><div style="flex:1"></div>
      <button class="iconbtn" id="closeSheet" aria-label="Close"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="sheetbody" id="sb"></div>
    <div class="sheetfoot"><textarea id="ti" rows="1" placeholder="Ask anything about your texts or the exam"></textarea>
      <button class="btn brass small" id="tsend" style="min-height:44px">Send</button></div>
  </div>`);
  document.body.appendChild(sheet);
  const sb = sheet.querySelector('#sb'), ti = sheet.querySelector('#ti'), send = sheet.querySelector('#tsend');
  sheet.querySelector('#closeSheet').onclick = () => sheet.remove();

  const add = (cls, text) => { const b = el(`<div class="bubble ${cls}"></div>`); b.textContent = text; sb.appendChild(b); sb.scrollTop = sb.scrollHeight; return b; };

  if(SAMPLE === null){
    add('ai', 'The tutor chat needs Claude, and it is not available in this view. Everything else in the app works offline — the lessons, the drills, the model answers and the quotation bank.');
    ti.disabled = true; send.disabled = true;
  } else if(!turns.length){
    add('ai', 'Ask me anything — a quotation you cannot analyse, a paragraph you want torn apart, what to revise tonight. If you paste an answer, I will mark it against the real criteria.');
    const sugg = el(`<div class="wrap"></div>`);
    ['Mark this paragraph for me','Explain the 10-mark question again','Give me three Hamlet quotations for loyalty','What should I revise tonight?'].forEach(s => {
      const b = el(`<button class="chip">${esc(s)}</button>`);
      b.onclick = () => { ti.value = s; sugg.remove(); ask(); };
      sugg.appendChild(b);
    });
    sb.appendChild(sugg);
  } else {
    turns.forEach(t => add(t.role==='user'?'me':'ai', t.content));
  }

  ti.addEventListener('input', () => { ti.style.height='auto'; ti.style.height = Math.min(130, ti.scrollHeight) + 'px'; });
  ti.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey && !matchMedia('(pointer:coarse)').matches){ e.preventDefault(); ask(); } });
  send.onclick = ask;

  async function ask(){
    const q = ti.value.trim(); if(!q || !SAMPLE) return;
    ti.value=''; ti.style.height='auto'; send.disabled = true;
    add('me', q); turns.push({role:'user', content:q});
    const b = add('ai', 'Thinking…');
    try{
      const input = [{role:'user', content:TUTOR_RULES}, ...turns.slice(-10)];
      const { text } = await SAMPLE(input, { cache:false, modelTier:'default', onText:({text}) => { b.textContent = text; sb.scrollTop = sb.scrollHeight; } });
      turns.push({role:'assistant', content:text});
      touchStreak(); paintStreak();
    }catch(e){
      b.textContent = e.text || aiErrCopy(e.code) || 'Something went wrong. Try again.';
      if(e.code==='not_granted'||e.code==='sampling_disabled'){ ti.disabled=true; }
    }finally{ send.disabled = false; }
  }
}
$('#fab').onclick = openTutor;

/* ============================================================
   ROUTER
   ============================================================ */
function render(){
  view.innerHTML = '';
  paintTabs();
  if(S.tab==='today') viewToday();
  else if(S.tab==='learn') viewLearn();
  else if(S.tab==='practice') viewPractice();
  else if(S.tab==='texts') viewTexts();
  else viewProgress();
}
paintStreak();
render();
</script>
