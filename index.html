<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gaslight">
<meta name="theme-color" content="#F4F4F0">
<meta name="description" content="An interactive Higher English tutor: Jekyll and Hyde, Hamlet, RUAE and the folio, drilled against real SQA criteria.">
<style>
:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;background:#F4F4F0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Gaslight — Higher English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F4F4F0; --card:#FFFFFF; --card-2:#FAFAF7;
  --ink:#171C22; --ink-2:#4A5560; --ink-3:#7A848E;
  --rule:#DDDDD5; --rule-2:#EAEAE3;
  --brass:#8A6113; --brass-ink:#5E4209; --brass-soft:#F2E8D0;
  --claret:#7E2B33; --claret-soft:#F6E3E2;
  --sage:#3B6849; --sage-soft:#E2EFE5;
  --indigo:#2C4A6E; --indigo-soft:#E2E9F2;
  --shadow:0 1px 2px rgba(23,28,34,.06), 0 6px 18px rgba(23,28,34,.05);
  --shadow-lift:0 2px 6px rgba(23,28,34,.10), 0 14px 34px rgba(23,28,34,.10);
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --display:"Fraunces","Spectral",Georgia,serif;
  --tab-h:60px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10141A; --card:#191E26; --card-2:#1F252E;
    --ink:#E9E7E1; --ink-2:#A8AFB8; --ink-3:#78828D;
    --rule:#2A313B; --rule-2:#232A33;
    --brass:#D9A441; --brass-ink:#EFC978; --brass-soft:#2B2418;
    --claret:#E08E93; --claret-soft:#2E1C1E;
    --sage:#7FB392; --sage-soft:#182620;
    --indigo:#93B6DE; --indigo-soft:#172231;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.28);
    --shadow-lift:0 2px 6px rgba(0,0,0,.4), 0 14px 34px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --paper:#10141A; --card:#191E26; --card-2:#1F252E;
  --ink:#E9E7E1; --ink-2:#A8AFB8; --ink-3:#78828D;
  --rule:#2A313B; --rule-2:#232A33;
  --brass:#D9A441; --brass-ink:#EFC978; --brass-soft:#2B2418;
  --claret:#E08E93; --claret-soft:#2E1C1E;
  --sage:#7FB392; --sage-soft:#182620;
  --indigo:#93B6DE; --indigo-soft:#172231;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.28);
  --shadow-lift:0 2px 6px rgba(0,0,0,.4), 0 14px 34px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.5;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-family:var(--display);font-weight:700;letter-spacing:-.012em}
p{margin:0}
:focus-visible{outline:2.5px solid var(--brass);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- shell ---------- */
#shell{display:flex;flex-direction:column;min-height:100%}
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  display:flex; align-items:center; gap:10px;
  padding:10px 16px; background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--rule);
}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand b{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.02em}
.brand span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.spacer{flex:1}
.flamechip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
  background:var(--brass-soft);color:var(--brass-ink);font-size:12.5px;font-weight:600;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{background:var(--rule-2)}
main{flex:1;padding:16px 16px calc(var(--tab-h) + 60px + env(safe-area-inset-bottom,0px));max-width:760px;width:100%;margin:0 auto}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter:blur(14px);border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tabbar button{
  height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;font-weight:500;color:var(--ink-3);letter-spacing:.01em;
}
.tabbar button svg{width:21px;height:21px}
.tabbar button[aria-current="true"]{color:var(--brass)}
.tabbar button[aria-current="true"] .dot{opacity:1}
.dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:0;margin-top:-1px}

/* ---------- type ---------- */
.eyebrow{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.h-page{font-size:26px;line-height:1.14;margin:2px 0 4px}
.h-sec{font-size:19px;line-height:1.2}
.sub{color:var(--ink-2);font-size:14px}
.prose{font-family:var(--serif);font-size:16.5px;line-height:1.62;color:var(--ink)}
.prose p+p{margin-top:.8em}
.prose em{font-style:italic}
.tiny{font-size:12px;color:var(--ink-3)}
.mono-num{font-variant-numeric:tabular-nums}

/* ---------- blocks ---------- */
.stack{display:flex;flex-direction:column;gap:14px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}

.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:var(--card-2)}
.panel{border-top:1px solid var(--rule);padding-top:14px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.02em}
.pill.essay{background:var(--claret-soft);color:var(--claret)}
.pill.ruae{background:var(--indigo-soft);color:var(--indigo)}
.pill.scottish{background:var(--brass-soft);color:var(--brass-ink)}
.pill.folio{background:var(--sage-soft);color:var(--sage)}
.pill.ghost{background:var(--rule-2);color:var(--ink-2)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border-radius:11px;font-size:15px;font-weight:600;
  background:var(--ink);color:var(--paper);min-height:46px;
  transition:transform .12s ease, opacity .12s ease;
}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.secondary{background:var(--card);color:var(--ink);border:1px solid var(--rule)}
.btn.brass{background:var(--brass);color:#fff}
:root[data-theme="dark"] .btn.brass, :root:not([data-theme="light"]) .btn.brass{color:#181207}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn.brass{color:#fff}}
.btn.small{padding:8px 13px;min-height:38px;font-size:13.5px;border-radius:9px}
.btn.full{width:100%}

.link{color:var(--brass);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}

/* countdown strip */
.countdown{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.countdown div{background:var(--card);padding:13px 14px}
.countdown .n{font-family:var(--display);font-size:25px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.countdown .l{font-size:10.5px;color:var(--ink-3);margin-top:6px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.countdown .approx{font-family:var(--sans);font-size:15px;font-weight:500;color:var(--ink-3);vertical-align:2px;margin-right:1px}

/* list rows */
.rows{border:1px solid var(--rule);border-radius:14px;overflow:hidden;background:var(--card)}
.rowitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-bottom:1px solid var(--rule-2)}
.rowitem:last-child{border-bottom:none}
.rowitem:active{background:var(--card-2)}
.rowitem .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rowitem .t{display:block;font-weight:600;font-size:15px;line-height:1.3}
.rowitem .d{display:block;font-size:12.5px;line-height:1.35;color:var(--ink-3)}
.chev{color:var(--ink-3);flex:none}
.tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule);flex:none;display:grid;place-items:center;color:transparent}
.tick.on{background:var(--sage);border-color:var(--sage);color:#fff}

/* progress bar */
.bar{height:6px;border-radius:999px;background:var(--rule-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);border-radius:999px;transition:width .4s ease}
.bar.sage i{background:var(--sage)}

/* extract / quotation */
.extract{
  font-family:var(--serif);font-size:15.5px;line-height:1.66;
  background:var(--card-2);border:1px solid var(--rule);border-left:3px solid var(--brass);
  border-radius:0 12px 12px 0;padding:14px 15px;color:var(--ink);
  max-height:none;
}
.extract p+p{margin-top:.75em}
.extract .ln{color:var(--ink-3);font-family:var(--sans);font-size:10.5px;font-variant-numeric:tabular-nums}
.quote{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.5}

/* question card */
.qcard{background:var(--card);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow-lift);overflow:hidden}
.qcard .qhead{padding:14px 16px;border-bottom:1px solid var(--rule-2);display:flex;align-items:center;gap:8px}
.qcard .qbody{padding:16px}
.marks{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink-2);background:var(--rule-2);padding:3px 9px;border-radius:999px;white-space:nowrap}

.opt{
  display:block;width:100%;text-align:left;padding:13px 14px;border:1.5px solid var(--rule);
  border-radius:11px;background:var(--card);font-size:14.5px;line-height:1.4;transition:all .15s ease
}
.opt:active{transform:scale(.99)}
.opt.correct{border-color:var(--sage);background:var(--sage-soft)}
.opt.wrong{border-color:var(--claret);background:var(--claret-soft)}
.opt.dim{opacity:.5}

textarea.answer{
  width:100%;min-height:150px;padding:13px;border-radius:12px;border:1.5px solid var(--rule);
  background:var(--card-2);font-family:var(--serif);font-size:16px;line-height:1.6;resize:vertical;
}
textarea.answer:focus{border-color:var(--brass);outline:none;background:var(--card)}
.wordcount{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* feedback */
.fb{border-radius:12px;padding:14px;border:1px solid var(--rule);background:var(--card-2)}
.fb.good{border-color:color-mix(in srgb,var(--sage) 45%,var(--rule));background:var(--sage-soft)}
.fb h4{font-family:var(--sans);font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.fb ul{margin:0;padding-left:18px}
.fb li{margin:4px 0;font-size:14.5px;line-height:1.45}
.scoreline{display:flex;align-items:baseline;gap:9px;margin-bottom:8px}
.scoreline b{font-family:var(--display);font-size:30px;line-height:1;font-weight:700}

/* band table */
.bands{display:flex;flex-direction:column;gap:0;border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.band{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:11px 13px;border-bottom:1px solid var(--rule-2);font-size:13.5px;line-height:1.4}
.band:last-child{border-bottom:none}
.band b{font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums}
.band.hi{background:var(--brass-soft)}

/* flip card */
.flip{border:1px solid var(--rule);border-radius:14px;background:var(--card);padding:20px 16px;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center}

/* chips scroller */
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--rule);background:var(--card);font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* accordion */
.acc{border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--card)}
.acc summary{padding:13px 14px;font-weight:600;font-size:14.5px;cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";margin-left:auto;color:var(--ink-3);font-size:18px;line-height:1}
.acc[open] summary::after{content:"–"}
.acc .accbody{padding:0 14px 14px;font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.acc .accbody strong{color:var(--ink)}

/* confidence dots */
.conf{display:flex;gap:5px}
.conf button{width:27px;height:27px;border-radius:8px;border:1.5px solid var(--rule);font-size:12px;font-weight:600;color:var(--ink-3);display:grid;place-items:center}
.conf button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#fff}

/* tutor sheet */
.sheet{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;background:var(--paper)}
.sheet .sheethead{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--rule)}
.sheet .sheetbody{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.sheet .sheetfoot{border-top:1px solid var(--rule);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;background:var(--card)}
.sheet .sheetfoot textarea{flex:1;min-height:44px;max-height:130px;padding:11px 12px;border-radius:12px;border:1px solid var(--rule);background:var(--card-2);resize:none;font-family:var(--sans);font-size:15px}
.bubble{max-width:92%;padding:11px 14px;border-radius:15px;font-size:15px;line-height:1.5;white-space:pre-wrap}
.bubble.me{align-self:flex-end;background:var(--ink);color:var(--paper);border-bottom-right-radius:5px}
.bubble.ai{align-self:flex-start;background:var(--card);border:1px solid var(--rule);border-bottom-left-radius:5px}
.fab{
  position:fixed;right:16px;bottom:calc(var(--tab-h) + 14px + env(safe-area-inset-bottom,0px));z-index:45;
  height:48px;padding:0 17px;border-radius:999px;background:var(--brass);color:#fff;
  font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-lift)
}
:root[data-theme="dark"] .fab,:root:not([data-theme="light"]) .fab{color:#181207}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .fab{color:#fff}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 22px + env(safe-area-inset-bottom,0px));z-index:95;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lift)}

.backlink{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink-3);margin-bottom:10px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
hr.rule{border:none;border-top:1px solid var(--rule);margin:2px 0}
.mark-scale{display:flex;gap:4px;flex-wrap:wrap}
.mark-scale button{flex:1;min-width:34px;padding:9px 0;border:1.5px solid var(--rule);border-radius:9px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.mark-scale button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.timer{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:15px;font-weight:700}
.timer.warn{color:var(--claret)}
</style>

</head>
<body>
<div id="shell">
  <header class="topbar">
    <div class="brand"><b>Gaslight</b><span>Higher English · Joss</span></div>
    <div class="spacer"></div>
    <div class="flamechip" id="streakChip">0 day streak</div>
    <button class="iconbtn" id="themeBtn" aria-label="Switch theme">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </header>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<button class="fab" id="fab" hidden>
  <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-4-.9L3 21l1.9-4.9A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5Z"/></svg>
  Ask tutor
</button>
<script>
/* ============================================================
   GASLIGHT — Higher English tutor for Joss
   Built around SQA Higher English (course spec v6.0):
   RUAE 30 marks · Critical Reading 40 marks · Portfolio 30 marks
   Joss's texts: Jekyll & Hyde (Scottish text, prose) + Hamlet (essay, drama)
   ============================================================ */

const SKILLS = {
  essay:   { name: 'Critical essay',  short:'Essay',   cls:'essay',    note:'20 marks · Section 2' },
  ruae:    { name: 'RUAE',            short:'RUAE',    cls:'ruae',     note:'30 marks · own paper' },
  scottish:{ name: 'Scottish text',   short:'Scottish',cls:'scottish', note:'20 marks · Section 1' },
  folio:   { name: 'Portfolio',       short:'Folio',   cls:'folio',    note:'30 marks · coursework' }
};

const COURSE = [
  { term:'Aug – Oct',  head:'Scottish set text', body:'The Strange Case of Dr Jekyll and Mr Hyde. Gothic and Urban Gothic background, then reading the novel. Weekly RUAE homework starts. Writing-journal pieces build a bank for the folio.' },
  { term:'Oct – Dec',  head:'Critical essay text', body:'Hamlet. Folio completed this term. Weekly RUAE continues. Prelim revision, including the poem missed in June.' },
  { term:'January',    head:'Prelim', body:'Full paper conditions. This is the mark that goes on record for appeals, so treat it as the real thing.' },
  { term:'Jan – Apr',  head:'Second essay text', body:'Either a media text or further poetry. Folio finalised and sent away. Outstanding unit assessments completed. Exam preparation.' },
  { term:'May',        head:'Exam diet', body:'RUAE (1 h 30) and Critical Reading (1 h 45), on separate days.' }
];

/* ---------- the rule that decides everything ---------- */
const GENRE_RULE = 'Jekyll and Hyde is PROSE. If you answer on it in Section 1, Section 2 must not be prose. Hamlet is DRAMA — that pairing is legal and it is the one to rehearse.';

/* ============================================================
   LESSONS
   ============================================================ */
const LESSONS = [

/* ---------------- CRITICAL ESSAY ---------------- */
{
  id:'e1', skill:'essay', mins:8,
  title:'What the 20 marks actually reward',
  blurb:'Four columns, one holistic judgement — and one gate that can cap you at 9.',
  sections:[
    { h:'The grid has four rows', p:'A marker is not counting points. They read the whole essay, then decide which band it sits in across four areas at once.',
      list:[
        '<strong>Knowledge and understanding</strong> — do you know the text, and is the evidence you pick the <em>right</em> evidence for this question?',
        '<strong>Analysis</strong> — do you explain the effect of the writer\'s techniques?',
        '<strong>Evaluation</strong> — do you show what you got out of the text? A stance.',
        '<strong>Technical accuracy</strong> — spelling, grammar, sentence construction, punctuation, paragraphing.'
      ]},
    { h:'The words that separate the bands', bands:[
        ['20–19','<b>perceptive</b> knowledge · <b>perceptive</b> selection of evidence · fluent · <b>committed</b> evaluative stance'],
        ['18–16','<b>secure</b> knowledge · <b>detailed</b> evidence · coherent · <b>engaged</b> stance'],
        ['15–13','<b>clear</b> knowledge · clear evidence · clearly structured · <b>clear</b> stance'],
        ['12–10','<b>adequate</b> throughout'],
        ['9–6','<b>limited</b> throughout'],
        ['5–0','very little']
      ], p:'An A is 19–20 out of 20 territory in this section, but the A grade overall is about 70% across the whole course. In practice: aim to live in the 16–20 band and the A takes care of itself.' },
    { h:'The gate', p:'The marker reads first for two things only: is it technically accurate enough to be understood at first reading, and is it relevant to the question. Fail either and the essay is capped at <strong>9 marks</strong> no matter how much you know. Five minutes of proofreading is worth more than an extra paragraph.' },
    { h:'Positive marking', p:'Marks are accumulated for what you do well, never deducted for what you get wrong. So a weak sentence does not cost you — but a weak sentence that replaces a strong one does. Every sentence should be earning.' }
  ],
  check:{ q:'An essay on Hamlet shows brilliant knowledge but has errors that make several sentences hard to follow on first reading. What is the maximum mark?', options:['20','16','9','13'], answer:2, why:'Failing the minimum technical-accuracy standard caps the essay at 9 marks. This is the single most expensive mistake in the paper.' }
},
{
  id:'e2', skill:'essay', mins:7,
  title:'Reading the question properly',
  blurb:'Every question is two tasks joined by "and". Most candidates only do the first.',
  sections:[
    { h:'The shape never changes', p:'Every critical essay question in every year follows the same three-part build:',
      list:[
        '<strong>Choose a play in which…</strong> — the hook. This tells you which text and which aspect.',
        '<strong>By referring to appropriate techniques, explain how…</strong> — task one. Analysis of the writer\'s craft.',
        '<strong>…and discuss how this contributes to your appreciation of the play as a whole.</strong> — task two. Evaluation and the whole text.'
      ]},
    { h:'The second half is where the marks are lost', p:'"Contributes to your appreciation of the text as a whole" is not decoration. It is asking: <em>so what?</em> Why does this scene / character / theme matter to the play in its entirety, and what did it give <em>you</em> as a reader?',
      example:{ bad:'This shows that Hamlet is indecisive.', good:'This hesitation is what makes the play a tragedy of thought rather than of action: Shakespeare makes us complicit in Hamlet\'s delay because we, too, find the Ghost\'s command more troubling the longer we consider it.' } },
    { h:'"Appropriate techniques" is a warning', p:'It reminds you that a technique appropriate for drama is not appropriate for poetry. For a play, the marker expects: <strong>soliloquy, dramatic irony, key scene, structure, climax, conflict, characterisation, staging, setting, imagery, theme.</strong> Naming "word choice" four times in a drama essay looks like a poetry essay in the wrong room.' },
    { h:'Two minutes you must spend', p:'Underline the abstract noun in the question (jealousy / loyalty / revelation / vulnerability). Write it at the top of your plan. Then write it, in your own hand, into the last sentence of every paragraph. That single habit is what turns "secure" into "perceptive focus on the demands of the question".' }
  ],
  check:{ q:'Which of these sentences is doing the "appreciation of the play as a whole" work?', options:['Shakespeare uses a soliloquy here to reveal Hamlet\'s thoughts.','The word "rank" suggests decay.','Because we hear this doubt before Hamlet ever acts, the whole revenge plot afterwards reads as something he is talking himself into rather than doing.','Hamlet is a tragedy written around 1600.'], answer:2, why:'It links a single moment to the shape and effect of the entire play — and it carries a judgement. That is evaluation, not summary.' }
},
{
  id:'e3', skill:'essay', mins:9,
  title:'The A-grade paragraph engine',
  blurb:'Point, evidence, analysis, evaluation, link. Five moves, in order, every time.',
  sections:[
    { h:'The five moves', list:[
        '<strong>Point</strong> — a claim that answers the question, not a plot statement.',
        '<strong>Evidence</strong> — short, embedded, exactly chosen. Never more than a line.',
        '<strong>Analysis</strong> — name the technique, then explain the <em>effect</em>. Two or three sentences minimum. This is where "detailed" becomes "perceptive".',
        '<strong>Evaluation</strong> — what this achieves for the play, or for you as a reader.',
        '<strong>Link</strong> — the question\'s own words, used as the final clause.'
      ]},
    { h:'Worked: Hamlet, "a play which explores loyalty"', p:'Watch the five moves land in order.',
      worked:[
        ['Point','Shakespeare uses Horatio to define the loyalty every other character fails to show.'],
        ['Evidence','Hamlet calls him a man "that is not passion\'s slave".'],
        ['Analysis','The metaphor of slavery is doing precise work. Everyone else in Elsinore is owned by something — Claudius by ambition, Gertrude by comfort, Laertes by rage, Hamlet himself by grief. Horatio alone is described in terms of what does not own him, so his loyalty is presented not as warmth but as a kind of freedom.'],
        ['Evaluation','This is why his survival at the end feels necessary rather than accidental: Shakespeare needs one uncorrupted witness left standing to carry the story out of the play.'],
        ['Link','Loyalty, then, is the one value the tragedy does not destroy, and that is what gives the closing scene its strange steadiness.']
      ]},
    { h:'The test for every paragraph', p:'Cover the quotation with your thumb. If the paragraph still makes an argument, you have analysed. If it collapses into "and then this happens", you have retold the plot.' },
    { h:'How many paragraphs?', p:'Four is the working number for 45 minutes: three substantial ones plus one that complicates or deepens the argument rather than adding a fourth example. Depth outscores coverage every single time.' }
  ],
  check:{ q:'What is the fastest way to move a paragraph from "clear analysis" to "perceptive analysis"?', options:['Add a second quotation','Explain more precisely what the technique does to the reader, and why the writer chose it here rather than anywhere else','Use a longer quotation','Name more techniques'], answer:1, why:'Perceptive means precise and earned. Stacking quotations gives breadth; explaining one choice deeply gives depth — and depth is what the top band describes.' }
},
{
  id:'e4', skill:'essay', mins:6,
  title:'The same quotation at three bands',
  blurb:'What "clear", "detailed" and "perceptive" look like on the page.',
  sections:[
    { h:'The line', p:'Hamlet, Act 1 Scene 2: <em>"How weary, stale, flat and unprofitable / Seem to me all the uses of this world."</em>' },
    { h:'Around 13 — "clear analysis"', p:'The word choice "weary, stale, flat and unprofitable" shows that Hamlet is depressed and has lost interest in life. This makes the audience feel sorry for him.' },
    { h:'Around 17 — "detailed analysis"', p:'The list of four adjectives — "weary, stale, flat and unprofitable" — piles one negative on another so that Hamlet\'s exhaustion feels total rather than passing. "Unprofitable" is a commercial word, which suggests he now measures existence itself and finds it worth nothing. The audience is placed inside a grief that has spread beyond his father to the world.' },
    { h:'Around 19–20 — "perceptive analysis"', p:'The four adjectives descend in register from the human to the accountant\'s ledger: "weary" is felt in the body, "stale" in the senses, "flat" in the mind, and "unprofitable" in the books. Shakespeare lets Hamlet arrive at a balance-sheet verdict on being alive, and the flatness of the line — no metaphor, no music — enacts the deadness it describes. Crucially this comes <em>before</em> the Ghost appears: the audience meets a man already unwilling to live, so the revenge plot never reads as the cause of his despair, only its excuse. It is the reason the play can be a tragedy of thought.' },
    { h:'What actually changed', list:[
        'The top version explains the <em>order</em> of the words, not just the words.',
        'It comments on form (the flatness of the line) as well as content.',
        'It places the moment in the structure of the whole play.',
        'It ends on a judgement — "the reason the play can be a tragedy of thought" — which is the evaluative stance the grid asks for.'
      ]}
  ],
  check:{ q:'The 19–20 version does one thing the 17 version never does. What?', options:['Uses a longer quotation','Names more techniques','Connects the moment to the structure and meaning of the whole play, and commits to a judgement','Uses more formal vocabulary'], answer:2, why:'"Perceptive" in the grid pairs with "committed evaluative stance". The top band is not more words — it is a position, argued.' }
},
{
  id:'e5', skill:'essay', mins:6,
  title:'Openings and closings that score',
  blurb:'Two paragraphs the marker reads with full attention. Make them count.',
  sections:[
    { h:'The introduction: four sentences, no more', list:[
        '<strong>Title and author</strong>, plus a one-clause description of what kind of play it is.',
        '<strong>A direct answer to the question</strong> — your line of thought, stated as a claim.',
        '<strong>Signpost</strong> — the two or three areas you will use to prove it.',
        '<strong>Stakes</strong> — one clause on why this matters to the play as a whole.'
      ],
      example:{ bad:'In this essay I will discuss the play Hamlet by William Shakespeare and how it explores the theme of loyalty. I will look at several characters and techniques.',
                good:'Shakespeare\'s <em>Hamlet</em> is a revenge tragedy in which almost every relationship is a test of loyalty that somebody fails. Through the contrast between Horatio\'s constancy and the calculated service of Rosencrantz and Guildenstern, and through the soliloquies in which Hamlet interrogates his own loyalty to his father, Shakespeare presents loyalty as the only value in Elsinore that cannot be performed. It is what the play measures every character against.' } },
    { h:'Never write these', list:['"In this essay I will…" — it spends a sentence announcing rather than arguing.','A biography of the author.','A retelling of the plot.','"There are many techniques used in this play."'] },
    { h:'The conclusion: three sentences', list:[
        'Answer the question again — differently worded, sharper than the intro.',
        'Say what the play does <em>as a whole</em> because of this.',
        'Your stance: what it gave you. One honest sentence, not "I really enjoyed this play".'
      ],
      example:{ bad:'In conclusion, Hamlet is a great play which explores loyalty in many ways, as I have shown above.',
                good:'Loyalty in <em>Hamlet</em> is finally shown to be unperformable: the moment it is spoken about, it is already compromised. What stays with me is that Shakespeare gives the play\'s last words to the one man who never made a speech about being loyal, and simply was.' } }
  ],
  check:{ q:'Which sentence belongs in an A-grade introduction?', options:['I will be discussing three techniques in this essay.','Shakespeare presents loyalty as the only value in Elsinore that cannot be performed.','Hamlet was written by William Shakespeare in about 1600.','Hamlet is a very famous play that many people have studied.'], answer:1, why:'It is a claim — a line of thought the rest of the essay can prove. The others announce, date or flatter; none of them argue.' }
},
{
  id:'e6', skill:'essay', mins:7,
  title:'Hamlet: mapping the play onto the three questions',
  blurb:'Whatever comes up, you are answering with the same prepared material.',
  sections:[
    { h:'Past questions come in three flavours', p:'Drama questions are always one of: a <strong>character</strong> question, a <strong>key scene</strong> question, or a <strong>theme</strong> question. Prepare four blocks of material and all three are covered.' },
    { h:'Your four blocks', list:[
        '<strong>Block A — the soliloquies.</strong> "O that this too too solid flesh", "To be or not to be", "How all occasions do inform against me". Covers: character, theme, structure.',
        '<strong>Block B — The Mousetrap (III.ii).</strong> Play-within-a-play, dramatic irony, the turning point. Covers: key scene, revelation, appearance vs reality.',
        '<strong>Block C — the closet scene (III.iv).</strong> Hamlet and Gertrude, the killing of Polonius. Covers: turning point, character, conflict, consequence.',
        '<strong>Block D — the graveyard and the duel (V).</strong> Yorick, "the readiness is all", the ending. Covers: climax, resolution, theme of mortality, change in the central character.'
      ]},
    { h:'Worked mappings', worked:[
        ['"A central character presented as vulnerable"','Blocks A + C. The soliloquies show vulnerability he chooses to voice; the closet scene shows it breaking out as violence.'],
        ['"A scene involving a significant revelation or turning point"','Block B, then Block C as consequence. The Mousetrap reveals Claudius\'s guilt to Hamlet — and Hamlet\'s knowledge to Claudius. Both men are now armed.'],
        ['"A play which explores jealousy or loyalty"','Horatio, Rosencrantz and Guildenstern, Laertes, the Ghost\'s claim on Hamlet. Blocks A + D.'],
        ['"A scene important to the outcome of the play"','Block C. Polonius\'s death is the hinge: it gives Claudius his pretext, gives Laertes his motive, and drives Ophelia mad.']
      ]},
    { h:'Rehearse the pivot, not the essay', p:'Do not memorise an essay — a pre-written essay dropped onto a different question is exactly what "limited focus on the demands of the question" means. Memorise the blocks, and practise the first sentence that bends a block towards a question you have not seen.' }
  ],
  check:{ q:'Why is the closet scene (III.iv) the strongest answer to a "scene important to the outcome" question?', options:['It is the longest scene','Polonius\'s death sets off Claudius\'s pretext to remove Hamlet, Laertes\'s revenge and Ophelia\'s madness — three strands of the ending','It contains a famous quotation','It is in the middle of the play'], answer:1, why:'"Important to the outcome" means causally load-bearing. Show three consequences and the importance proves itself.' }
},
{
  id:'e7', skill:'essay', mins:5,
  title:'45 minutes, spent properly',

  sections:[
    { h:'Minutes 0–5: the plan', p:'Underline the key word in the question. Write four paragraph points — claims, not topics. Beside each, jot the quotation you will use. If a point has no quotation, drop it now rather than at minute 30.' },
    { h:'Minutes 5–40: write', p:'Roughly 8 minutes per paragraph. If a paragraph is running long, close it with the link sentence and move. An unfinished essay loses more than a rushed paragraph.' },
    { h:'Minutes 40–45: the proofread that saves your band', p:'You are hunting one thing only: sentences a stranger would have to read twice. Also check:',
      list:['Every paragraph ends with the question\'s own words.','Play title underlined or in quotation marks, consistently.','Character names spelled right — Gertrude, Claudius, Rosencrantz, Ophelia, Horatio, Fortinbras.','No sentence longer than three lines without a full stop.'] },
    { h:'If you run out of time', p:'Stop writing prose and bullet the remaining argument. A marker can award knowledge and analysis marks from clear notes; they can award nothing from a paragraph that stops mid-sentence.' }
  ],
  check:{ q:'You are at minute 40 with one paragraph still to write. Best move?', options:['Write it fast and skip proofreading','Bullet the final argument clearly, then proofread','Leave it out entirely','Write a long conclusion instead'], answer:1, why:'Bulleted argument still earns knowledge and analysis marks. Skipping the proofread risks the technical-accuracy cap, which costs far more.' }

{
  id:'r1', skill:'ruae', mins:7,
  title:'How RUAE marks are actually awarded',
  blurb:'One principle explains almost every mark you have ever lost.',
  sections:[
    { h:'The principle', p:'<strong>No marks are ever given for identifying an example on its own.</strong> Marks are given for the <em>analytical comment</em> that accompanies it. Generally: 1 mark for a basic comment, 2 marks for a detailed or insightful one.' },
    { h:'So a 4-mark analysis question is', list:[
        'Two references, each with a detailed comment (2 + 2), <strong>or</strong>',
        'Four references each with a basic comment (1 + 1 + 1 + 1), <strong>or</strong>',
        'Any mix that adds to 4.'
      ], p:'Two strong comments are faster and safer than four thin ones. But if a question says "by referring to at least two examples", you must give at least two — one brilliant comment caps at 2.' },
    { h:'The shape of a scoring comment', p:'<strong>Quote → name the technique → say what it suggests → tie it to the idea in the passage.</strong> The last step is the one most people skip, and it is what turns 1 mark into 2.',
      example:{ bad:'The writer uses the word "ravenous", which shows they were hungry.', good:'"Ravenous" carries connotations of animal starvation rather than ordinary appetite, suggesting the crowd\'s desire for the artist\'s work had become predatory rather than appreciative — which supports the writer\'s argument that fame consumed him.' } },
    { h:'Command words', list:[
        '<strong>Identify</strong> — name it briefly. No analysis needed.',
        '<strong>Explain / in what way</strong> — make the cause and effect clear. Own words.',
        '<strong>Analyse</strong> — features of language and their relationship to the ideas.',
        '<strong>Evaluate</strong> — make a judgement on the effect.'
      ]}
  ],
  check:{ q:'A question is worth 4 marks and says "by referring to at least two examples". You write one outstanding, deeply detailed comment. Maximum mark?', options:['4','3','2','0'], answer:2, why:'One reference can earn at most 2 marks. The instruction "at least two examples" is a floor you must meet — count your references before you move on.' }
},
{
  id:'r2', skill:'ruae', mins:6,
  title:'"Use your own words" — the translation drill',
  blurb:'One point per mark. Change every content word the marker is looking at.',
  sections:[
    { h:'The rule', p:'A 3-mark own-words question wants <strong>three separate ideas</strong>, each translated. Not three sentences about one idea. Count your marks on your fingers as you write.' },
    { h:'What counts as "own words"', p:'You may keep names, dates, technical terms with no synonym, and very common words. You must change the words carrying the meaning.',
      example:{ bad:'The writer says the scheme was implemented hastily and without adequate consultation.', good:'The plan was rushed through, and the people it affected were not properly asked first.' } },
    { h:'A method that works under pressure', list:[
        'Find the lines. Count the marks. That is how many ideas you need.',
        'Put a slash in the margin at each separate idea in the passage.',
        'Cover the passage with your hand.',
        'Write each idea from memory. Memory forces translation automatically.'
      ]},
    { h:'The trap', p:'"Explain <em>fully</em>" means the examiner thinks there is more in there than you will see at first glance. When you see "fully", go back and look for the second half of the idea — usually a consequence, a contrast, or a reason.' }
  ],
  check:{ q:'A question asks you to "explain two reasons" and is worth 2 marks. What does a complete answer look like?', options:['One long, detailed paragraph about the main reason','Two distinct reasons, each in your own words','Two quotations from the passage','One reason plus a quotation'], answer:1, why:'Marks map to ideas. Two marks, two reasons, both translated — quotations earn nothing in an own-words question.' }
},
{
  id:'r3', skill:'ruae', mins:8,
  title:'Imagery: the transfer method',
  blurb:'Literal root first, then the transfer. Miss the root, cap at 1 mark.',
  sections:[
    { h:'Three sentences, always in this order', list:[
        '<strong>Name it.</strong> "The writer uses the metaphor of…"',
        '<strong>Root it.</strong> Just as X literally means / does…',
        '<strong>Transfer it.</strong> …so the writer suggests that Y is likewise…'
      ]},
    { h:'Worked', p:'<em>"The proposal was a Trojan horse, wheeled in past a grateful council."</em>',
      example:{ bad:'The metaphor "Trojan horse" shows the proposal was sneaky.',
                good:'The writer uses the metaphor of a "Trojan horse". Literally, a Trojan horse was a gift that concealed an invading army, accepted willingly by the people it destroyed. This suggests the proposal was similarly welcomed by the council precisely because its real purpose was hidden, and that the harm it carried would come from inside their own walls — reinforcing the writer\'s argument that the damage was self-inflicted.' } },
    { h:'Why "wheeled in past a grateful council" matters', p:'"Grateful" is doing as much work as the metaphor. Top answers notice that the image is extended — the writer keeps the comparison running — and say so. Extended imagery is worth commenting on as a structural choice, not just a word.' },
    { h:'Personification, simile, symbol', p:'Same three steps. The only change is the naming. For personification, say what human quality is given and what that implies about the thing — usually that it has agency or menace it should not have.' }
  ],
  check:{ q:'Why does "the metaphor shows the proposal was sneaky" only earn 1 mark at best?', options:['It is too short','It never explains the literal meaning of the image, so the transfer is asserted rather than shown','"Sneaky" is too informal','It does not include a quotation'], answer:1, why:'The root is the evidence for the transfer. Without it you have named a technique and guessed an effect — the definition of a basic comment.' }
},
{
  id:'r4', skill:'ruae', mins:8,
  title:'Sentence structure: name the feature, then the effect',
  blurb:'The one question type where you must not talk about word meaning.',
  sections:[
    { h:'Features worth knowing cold', list:[
        '<strong>Short/minor sentence</strong> — abruptness, emphasis, finality.',
        '<strong>List</strong> — accumulation; the sheer number is the point.',
        '<strong>Climax</strong> — a list building to its most important item last.',
        '<strong>Anticlimax / bathos</strong> — a list collapsing into something trivial. Usually humour or contempt.',
        '<strong>Parenthesis</strong> (dashes, brackets, commas) — an aside; adds information or a change of voice without breaking the sentence.',
        '<strong>Repetition / parallel structure</strong> — insistence, or a pointed comparison between the two halves.',
        '<strong>Colon</strong> — introduces an explanation, expansion or list. The second half delivers what the first half promised.',
        '<strong>Semicolon</strong> — balances two equally weighted ideas; often used for contrast.',
        '<strong>Rhetorical question</strong> — draws the reader into the argument.',
        '<strong>Inversion</strong> — a word pushed out of its normal place is emphasised.'
      ]},
    { h:'The scoring sentence', p:'<strong>"The writer uses [feature] — [quote the structural evidence] — which [effect], emphasising that [idea from the passage]."</strong>' },
    { h:'Worked', p:'<em>"There were no hearings, no impact study, no vote. Nothing."</em>',
      example:{ bad:'The short sentence "Nothing." makes it stand out.',
                good:'The writer uses a list of three negatives — "no hearings, no impact study, no vote" — whose repeated "no" accumulates the absences until the process sounds systematically empty. This is then closed by the minor sentence "Nothing.", whose abruptness delivers the verdict the list was building towards and leaves the reader with the writer\'s judgement rather than the evidence.' } },
    { h:'The rule that trips everyone', p:'If the question says <em>sentence structure</em>, do not analyse connotation. "The word \'nothing\' suggests emptiness" is a word-choice answer and scores zero on a structure question. Talk about position, length, punctuation, repetition and pattern.' }
  ],
  check:{ q:'On a sentence-structure question, which comment scores?', options:['"Brutal" has connotations of violence.','The one-word sentence placed after a long, clause-heavy sentence makes the judgement land with sudden force.','The writer uses emotive language to persuade us.','The metaphor compares the policy to a storm.'], answer:1, why:'It talks about length and position — structure. The others are word choice, tone and imagery, none of which the question asked for.' }
},
{
  id:'r5', skill:'ruae', mins:6,
  title:'Link questions and paragraph function',
  blurb:'Two halves, two jobs. Quote each half and say what it points to.',
  sections:[
    { h:'The formula', list:[
        'Quote the part of the sentence that refers <strong>backwards</strong>, and summarise the idea it is closing off.',
        'Quote the part that refers <strong>forwards</strong>, and summarise the idea it introduces.'
      ], p:'Two marks, one for each half. Answer it mechanically — this is the most reliable mark in the paper.' },
    { h:'Worked', p:'Link sentence: <em>"But if the costs are obvious, the benefits are harder to see."</em>',
      example:{ good:'"If the costs are obvious" links back to the previous paragraph, which set out the clear financial damage of the scheme. "The benefits are harder to see" introduces the next paragraph, which examines the less visible advantages the writer goes on to argue for. "But" signals the contrast between the two.' } },
    { h:'"Explain the function of the opening / final paragraph"', p:'Openings: do they set a scene, establish tone, pose a question, or state a position the rest will defend? Say which, with evidence. Closings: do they return to the opening image (circular structure), widen out, or deliver a verdict? Name the effect on the reader.' },
    { h:'Words that are always doing linking work', p:'However · Yet · But · And so · Nevertheless · In contrast · Meanwhile · Of course · Even so. If one of these opens a paragraph, the question is probably about it.' }
  ],
  check:{ q:'What does a 2-mark link answer need?', options:['One long explanation of the sentence','A quotation from each half, with the idea each half connects to','A comment on the writer\'s tone','Three examples of linking words'], answer:1, why:'One mark per half, and each mark needs the quotation plus the idea it points to. Nothing else scores here.' }
},
{
  id:'r6', skill:'ruae', mins:7,
  title:'The final 5-mark question on both passages',
  blurb:'Three key areas, evidence from both passages. The most predictable 5 marks in the paper.',
  sections:[
    { h:'How it is marked', bands:[
        ['5','Three key areas, with <b>detailed or insightful</b> supporting evidence'],
        ['4','Three key areas, with appropriate supporting evidence'],
        ['3','Three key areas identified'],
        ['2','Two key areas identified'],
        ['1','One key area identified'],
        ['0','No key area identified, or the task misunderstood']
      ], p:'So identifying three areas alone already banks 3 marks. Evidence lifts you to 4 or 5. Bullet points are explicitly allowed.' },
    { h:'The grid method', p:'Draw a three-row, two-column grid. Rows = your three areas. Columns = Passage 1 / Passage 2. Fill every box before you write a word of prose. If a box is empty, that area is not one of your three.' },
    { h:'What counts as a "key area"', p:'A point of substance both writers address — not a technique, and not a detail. Ask: what is the <em>question</em> both writers are answering? Their answers may agree or disagree; the question is the key area.' },
    { h:'Format that scores fast', p:'<strong>Both writers agree that [key area].</strong> Writer 1 says [own words, brief reference]. Writer 2 similarly argues [own words, brief reference]. Three of those and you are done in ten minutes.' },
    { h:'Read the instruction', p:'It will say agreement <em>or</em> disagreement. Answering the wrong one is a misunderstanding of the task and scores 0. Circle the word before you start.' }
  ],
  check:{ q:'You identify three key areas of agreement but give no supporting evidence. Mark?', options:['0','1','3','5'], answer:2, why:'Three areas identified is worth 3. Every extra minute spent adding brief evidence from both passages is worth up to two more marks — the best rate of return in the paper.' }
},
{
  id:'r7', skill:'ruae', mins:6,
  title:'Tone, and the words you are allowed to use',
  blurb:'Name the tone precisely, then prove it from the language.',
  sections:[
    { h:'Two moves', list:['Name the tone using a real tone word.','Show how the language creates it — usually word choice, but often sentence structure, punctuation or register clash.'] },
    { h:'A usable vocabulary', p:'Admiring · scathing · wry · self-deprecating · nostalgic · indignant · detached · conversational · reverent · dismissive · sardonic · urgent · elegiac · playful · matter-of-fact · scornful · affectionate.',
      note:'"Negative" and "positive" are not tones. They are temperatures.' },
    { h:'How tone is built', list:[
        '<strong>Register clash</strong> — formal subject, casual word (or the reverse). Usually humour or contempt.',
        '<strong>Hyperbole / understatement</strong> — exaggeration for mockery; understatement for dry wit.',
        '<strong>Direct address and questions</strong> — conversational, or accusatory.',
        '<strong>Punctuation</strong> — exclamation, dashes, ellipsis. Urgency, interruption, hesitation.',
        '<strong>Repetition</strong> — insistence, or incantation.'
      ]},
    { h:'Worked', p:'<em>"It was, the minister assured us, a world-class strategy. Forty-one pages. Three of them not blank."</em>',
      example:{ good:'The tone is sardonic. The formal quotation "world-class strategy" is immediately undercut by the minor sentences "Forty-one pages. Three of them not blank.", and the anticlimactic slide from an impressive number to a humiliating one lets the writer mock the claim without ever contradicting it directly.' } }
  ],
  check:{ q:'Which is a tone word you can defend in an answer?', options:['Negative','Sardonic','Interesting','Descriptive'], answer:1, why:'Sardonic names a specific attitude you can then evidence. "Negative" is a temperature, and markers do not credit it as a tone.' }

    { ref:'Lines 25–49', text:`‘What I heard was abominable,’ said Utterson.

{
  id:'jh25', text:'Jekyll and Hyde', source:'SQA 2025, Section 1, Text 3 — Prose',
  setup:'From Chapter 10, "Henry Jekyll’s Full Statement of the Case". Jekyll is remembering his changing relationship with Hyde.',
  blocks:[
    { ref:'Lines 1–11', text:`When I came to myself at Lanyon’s, the horror of my old friend perhaps affected me somewhat: I do not know; it was at least but a drop in the sea to the abhorrence with which I looked back upon these hours. A change had come over me. It was no longer the fear of the gallows, it was the horror of being Hyde that racked me. I received Lanyon’s condemnation partly in a dream; it was partly in a dream that I came home to my own house and got into bed. I slept after the prostration of the day, with a stringent and profound slumber which not even the nightmares that wrung me could avail to break. I awoke in the morning shaken, weakened, but refreshed. I still hated and feared the thought of the brute that slept within me, and I had not of course forgotten the appalling dangers of the day before; but I was once more at home, in my own house and close to my drugs; and gratitude for my escape shone so strong in my soul that it almost rivalled the brightness of hope.` },
    { ref:'Lines 12–28', text:`I was stepping leisurely across the court after breakfast, drinking the chill of the air with pleasure, when I was seized again with those indescribable sensations that heralded the change; and I had but the time to gain the shelter of my cabinet, before I was once again raging and freezing with the passions of Hyde. It took on this occasion a double dose to recall me to myself; and alas, six hours after, as I sat looking sadly in the fire, the pangs returned, and the drug had to be re-administered.

In short, from that day forth it seemed only by a great effort as of gymnastics, and only under the immediate stimulation of the drug, that I was able to wear the countenance of Jekyll. At all hours of the day and night, I would be taken with the premonitory shudder; above all, if I slept, or even dozed for a moment in my chair, it was always as Hyde that I awakened. Under the strain of this continually impending doom and by the sleeplessness to which I now condemned myself, ay, even beyond what I had thought possible to man, I became, in my own person, a creature eaten up and emptied by fever, languidly weak both in body and mind, and solely occupied by one thought: the horror of my other self. But when I slept, or when the virtue of the medicine wore off, I would leap almost without transition (for the pangs of transformation grew daily less marked) into the possession of a fancy brimming with images of terror, a soul boiling with causeless hatreds, and a body that seemed not strong enough to contain the raging energies of life.` },
    { ref:'Lines 29–49', text:`The powers of Hyde seemed to have grown with the sickliness of Jekyll. And certainly the hate that now divided them was equal on each side. With Jekyll, it was a thing of vital instinct. He had now seen the full deformity of that creature that shared with him some of the phenomena of consciousness, and was co-heir with him to death: and beyond these links of community, which in themselves made the most poignant part of his distress, he thought of Hyde, for all his energy of life, as of something not only hellish but inorganic. This was the shocking thing; that the slime of the pit seemed to utter cries and voices; that the amorphous dust gesticulated and sinned; that what was dead, and had no shape, should usurp the offices of life. And this again, that that insurgent horror was knit to him closer than a wife, closer than an eye; lay caged in his flesh, where he heard it mutter and felt it struggle to be born; and at every hour of weakness, and in the confidence of slumber, prevailed against him, and deposed him out of life.

The hatred of Hyde for Jekyll was of a different order. His terror of the gallows drove him continually to commit temporary suicide, and return to his subordinate station of a part instead of a person; but he loathed the necessity, he loathed the despondency into which Jekyll was now fallen, and he resented the dislike with which he was himself regarded. Hence the ape-like tricks that he would play me, scrawling in my own hand blasphemies on the pages of my books, burning the letters and destroying the portrait of my father; and indeed, had it not been for his fear of death, he would long ago have ruined himself in order to involve me in the ruin. But his love of life is wonderful; I go further: I, who sicken and freeze at the mere thought of him, when I recall the abjection and passion of this attachment, and when I know how he fears my power to cut him off by suicide, I find it in my heart to pity him.` }

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  document.querySelectorAll('.toast').forEach(n=>n.remove());
  const el = document.createElement('div'); el.className='toast'; el.textContent = msg;
  document.body.appendChild(el); clearTimeout(toastT);
  toastT = setTimeout(()=>el.remove(), 2200);
}

/* ---------- daily queue (deterministic per date) ---------- */
function seeded(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return ()=>{ h=Math.imul(h^h>>>15,2246822507); h=Math.imul(h^h>>>13,3266489909); return ((h^h>>>16)>>>0)/4294967296; }; }
function buildQueue(){
  const r = seeded(today());
  const weak = Object.keys(SKILLS).sort((a,b)=>(S.conf[a]||0)-(S.conf[b]||0));
  const want = ['essay','essay', weak[0], 'ruae', weak[1]==='essay'?'scottish':weak[1]];
  const out = [];
  want.forEach(sk => {
    const pool = DRILLS.map((d,i)=>({d,i})).filter(x=>x.d.s===sk && !out.includes(x.i));
    if(!pool.length) return;
    out.push(pool[Math.floor(r()*pool.length)].i);
  });
  while(out.length < 5){
    const i = Math.floor(r()*DRILLS.length);
    if(!out.includes(i)) out.push(i);
  }
  return out;
}
function ensureDay(){
  if(S.day !== today()){ S.day = today(); S.queue = buildQueue(); S.qi = 0; save(); }
}

const DEFAULT_DATES = { prelim:'2027-01-11', exam:'2027-05-03' };
function dateFor(k){ return S.dates[k] || DEFAULT_DATES[k]; }
function daysTo(k){
  const d = new Date(dateFor(k)+'T09:00:00');
  return Math.max(0, Math.ceil((d - new Date())/864e5));
}
function setDate(k, label){
  const cur = dateFor(k);
  const v = prompt(label + '\nEnter the date as YYYY-MM-DD:', cur);
  if(!v) return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){ toast('Use the format 2027-01-11'); return; }
  S.dates[k] = v; save(); render();
}

const MARKER_RULES = `You are an experienced SQA Higher English marker in Scotland. Apply these real marking principles exactly:
- Positive marking: award marks for what is done well; never deduct.
- For analysis questions: no marks for a quotation or example on its own. 1 mark for a basic analytical comment plus reference; 2 marks for a detailed or insightful comment plus reference.
- For "use your own words" questions: one mark per distinct idea, correctly recast. Copied phrasing earns nothing.
- For the critical essay (20 marks): judge holistically across knowledge and understanding, analysis, evaluation, and technical accuracy. Bands: 20-19 perceptive/committed; 18-16 secure/detailed/engaged; 15-13 clear; 12-10 adequate; 9-6 limited; 5-0 very little. If the writing has errors that impede understanding at first reading, or is not relevant to the question, cap at 9.
- For the 10-mark Scottish text question: 2 marks for identifying commonality, 2 for a detailed comment on the printed extract, 6 for three detailed comments on other parts of the text.
Be exact and generous only where the evidence supports it. Never inflate. Speak directly to the student as "you". Be specific about the actual words they wrote.`;

async function mark(opts, onStream){
  const prompt = [
    MARKER_RULES,
    '',
    'TASK TYPE: ' + opts.kind,
    'QUESTION: ' + opts.question,
    'MARKS AVAILABLE: ' + opts.marks,
    opts.context ? 'RELEVANT TEXT THE STUDENT IS ANALYSING:\n' + opts.context : '',
    opts.model ? 'POINTS A GOOD ANSWER MIGHT MAKE (not exhaustive; credit anything valid):\n' + opts.model : '',
    '',
    "STUDENT'S ANSWER:\n" + opts.answer,
    '',
    'Reply with only a JSON object of this exact shape:',
    '{"mark": <integer 0-' + opts.marks + '>, "band": "<short band label>", "strengths": ["<what earned marks, quoting their words>"], "fixes": ["<the single most valuable change, then the next>"], "upgrade": "<rewrite ONE of their sentences at a higher band, so they can see the difference>"}',
    'Give at most 3 strengths and 3 fixes. Keep each under 40 words. Be concrete.'
  ].filter(Boolean).join('\n');
  return SAMPLE.json(prompt, { modelTier:'complex', cache:false, onText:onStream });
}

function aiErrCopy(code){
  switch(code){
    case 'not_granted': case 'sampling_disabled': case 'not_declared': return 'Marking by Claude is not available on this device. Use the model answer below to mark yourself.';
    case 'rate_limited': return 'Too many requests just now. Wait a minute and try again, or mark yourself against the model answer.';
    case 'session_expired': return 'Sign in to Claude again to use marking.';
    case 'invalid_json': return 'The marker got confused. Tap Mark again.';
    case 'cancelled': return '';
    default: return 'Something went wrong reaching the marker. Try again, or mark yourself against the model answer.';
  }
}

function openDrill(){
  ensureDay();
  view.innerHTML = '';
  const d = DRILLS[S.queue[S.qi]];
  const wrap = document.createElement('div'); wrap.className = 'stack';
  wrap.appendChild(back('Today', () => { render(); }));
  wrap.appendChild(el(`<div class="bar"><i style="width:${Math.round(100*S.qi/S.queue.length)}%"></i></div>`));

  const next = () => { S.qi++; save(); touchStreak(); paintStreak(); if(S.qi >= S.queue.length){ render(); toast('Drill complete'); } else openDrill(); };

  if(d.t === 'mcq') wrap.appendChild(cardMCQ(d, next));
  else if(d.t === 'flip') wrap.appendChild(cardFlip(d, next));
  else wrap.appendChild(cardMicro(d, next));

  view.appendChild(wrap); scrollTo(0,0);

function cardMCQ(d, next){
  const c = el(`<div class="qcard">
    <div class="qhead">${pill(d.s)}<span class="tiny">Quick check</span></div>
    <div class="qbody stack">
      <p style="font-size:16.5px;line-height:1.45;font-weight:500">${esc(d.q)}</p>
      <div class="stack-s opts"></div>
      <div class="fbslot"></div>
    </div></div>`);
  const opts = c.querySelector('.opts');
  let answered = false;
  d.o.forEach((o,i) => {
    const b = el(`<button class="opt">${esc(o)}</button>`);
    b.onclick = () => {
      if(answered) return; answered = true;
      S.drills.done++; if(i===d.a) S.drills.right++;
      S.conf[d.s] = Math.max(0, Math.min(5, (S.conf[d.s]||0) + (i===d.a ? 0.5 : -0.5)));
      save();
      opts.querySelectorAll('.opt').forEach((n,j) => {
        if(j===d.a) n.classList.add('correct');
        else if(j===i) n.classList.add('wrong');
        else n.classList.add('dim');
      });
      const fb = el(`<div class="fb ${i===d.a?'good':''}"><h4>${i===d.a?'Right':'Not quite'}</h4><p style="font-size:14.5px;line-height:1.5">${esc(d.why)}</p></div>`);
      c.querySelector('.fbslot').appendChild(fb);
      const n = el(`<button class="btn full" style="margin-top:12px">Next</button>`); n.onclick = next;
      c.querySelector('.fbslot').appendChild(n);
      n.scrollIntoView({behavior:'smooth', block:'nearest'});
    };
    opts.appendChild(b);
  });
  return c;
}

function cardFlip(d, next){
  const c = el(`<div class="qcard">
    <div class="qhead">${pill(d.s)}<span class="tiny">Recall card</span></div>
    <div class="qbody stack">
      <div class="flip"><div class="eyebrow">Technique</div><h2 class="h-sec">${esc(d.f)}</h2><p class="tiny back-hint">Say the effect out loud, then reveal.</p></div>
      <div class="slot"></div>
    </div></div>`);
  const slot = c.querySelector('.slot');
  const rev = el(`<button class="btn secondary full">Reveal</button>`);
  rev.onclick = () => {
    rev.remove();
    slot.appendChild(el(`<div class="fb"><h4>What to say</h4><p style="font-size:14.5px;line-height:1.55">${esc(d.b)}</p></div>`));
    const row = el(`<div class="row" style="margin-top:12px;gap:8px"></div>`);
    const a = el(`<button class="btn secondary" style="flex:1">Shaky</button>`);
    const b = el(`<button class="btn" style="flex:1">Knew it</button>`);
    a.onclick = () => { S.conf[d.s] = Math.max(0,(S.conf[d.s]||0)-0.5); S.drills.done++; save(); next(); };
    b.onclick = () => { S.conf[d.s] = Math.min(5,(S.conf[d.s]||0)+0.5); S.drills.done++; S.drills.right++; save(); next(); };
    row.appendChild(a); row.appendChild(b); slot.appendChild(row);
  };
  slot.appendChild(rev);
  return c;
}

function cardMicro(d, next){
  const c = el(`<div class="qcard">
    <div class="qhead">${pill(d.s)}<span class="tiny">Write it out</span><span class="marks">${d.marks} mark${d.marks>1?'s':''}</span></div>
    <div class="qbody stack">
      <p style="font-size:16px;line-height:1.5;font-weight:500">${esc(d.q)}</p>
      <textarea class="answer" id="micro-ans" placeholder="Write your answer. Quote, name the technique, then explain the effect."></textarea>
      <div class="row"><span class="wordcount">0 words</span><div style="flex:1"></div></div>
      <div class="slot stack"></div>
    </div></div>`);
  const ta = c.querySelector('textarea'), wc = c.querySelector('.wordcount'), slot = c.querySelector('.slot');
  ta.addEventListener('input', () => { const n = ta.value.trim().split(/\s+/).filter(Boolean).length; wc.textContent = n + (n===1?' word':' words'); });

  const btnRow = el(`<div class="row" style="gap:8px"></div>`);
  const aiBtn = el(`<button class="btn brass" style="flex:1" data-ai-gate hidden>Mark my answer</button>`);
  const showBtn = el(`<button class="btn secondary" style="flex:1">Show model answer</button>`);
  btnRow.appendChild(aiBtn); btnRow.appendChild(showBtn);
  slot.appendChild(btnRow);
  if(SAMPLE) aiBtn.hidden = false;

  showBtn.onclick = () => {
    showBtn.remove();
    slot.appendChild(el(`<div class="fb"><h4>Model answer</h4><p style="font-family:var(--serif);font-size:15.5px;line-height:1.6">${esc(d.model)}</p></div>`));
    slot.appendChild(selfMark(d.marks, d.s, next));
  };
  aiBtn.onclick = async () => {
    if(!ta.value.trim()){ toast('Write something first'); return; }
    aiBtn.disabled = true; showBtn.disabled = true;
    const out = el(`<div class="fb"><h4>Marking</h4><p class="sub">Reading your answer…</p></div>`);
    slot.appendChild(out);
    try{
      const r = await mark({ kind:'Short analysis question', question:d.q, marks:d.marks, model:d.model, answer:ta.value });
      out.remove(); slot.appendChild(feedbackCard(r, d.marks, d.s, d.q));
      S.marks.push({ d:today(), s:d.s, m:r.mark, of:d.marks, q:d.q.slice(0,80) }); save();
      const n = el(`<button class="btn full">Next</button>`); n.onclick = next; slot.appendChild(n);
    }catch(e){
      out.remove(); const msg = aiErrCopy(e.code);
      if(msg) slot.appendChild(el(`<div class="fb"><h4>Marking unavailable</h4><p style="font-size:14.5px">${esc(msg)}</p></div>`));
      showBtn.disabled = false; aiBtn.disabled = false;
      if(e.code === 'not_granted' || e.code === 'sampling_disabled') aiBtn.remove();
    }
  };
  const skip = el(`<button class="btn secondary full" style="margin-top:4px">Skip</button>`); skip.onclick = next;
  slot.appendChild(skip);
  return c;
}

function selfMark(outOf, skill, next){
  const box = el(`<div class="card flat stack-s"><div class="eyebrow">Mark yourself honestly</div><div class="mark-scale"></div></div>`);
  const sc = box.querySelector('.mark-scale');
  for(let i=0;i<=outOf;i++){
    const b = el(`<button aria-pressed="false">${i}</button>`);
    b.onclick = () => {
      sc.querySelectorAll('button').forEach(n=>n.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true');
      S.conf[skill] = Math.max(0, Math.min(5, (S.conf[skill]||0) + (i/outOf >= .7 ? 0.5 : -0.5)));
      S.marks.push({ d:today(), s:skill, m:i, of:outOf, q:'self-marked' });
      S.drills.done++; save();
      if(next){ const n = el(`<button class="btn full" style="margin-top:10px">Next</button>`); n.onclick = next; box.appendChild(n); }
    };
    sc.appendChild(b);
  }
  return box;
}

function feedbackCard(r, outOf, skill, q){
  const m = Math.max(0, Math.min(outOf, Number(r.mark)||0));
  const good = m/outOf >= 0.75;
  S.conf[skill] = Math.max(0, Math.min(5, (S.conf[skill]||0) + (good ? 0.75 : (m/outOf>=0.5? 0.25 : -0.5))));
  const c = el(`<div class="fb ${good?'good':''}">
    <div class="scoreline"><b>${m}</b><span class="sub">out of ${outOf}${r.band?' · '+esc(r.band):''}</span></div>
  </div>`);
  if(Array.isArray(r.strengths) && r.strengths.length){
    c.appendChild(el(`<h4 style="margin-top:8px">What earned marks</h4>`));
    c.appendChild(el(`<ul>${r.strengths.slice(0,3).map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`));
  }
  if(Array.isArray(r.fixes) && r.fixes.length){
    c.appendChild(el(`<h4 style="margin-top:12px">Do this next time</h4>`));
    c.appendChild(el(`<ul>${r.fixes.slice(0,3).map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`));
  }
  if(r.upgrade){
    c.appendChild(el(`<h4 style="margin-top:12px">One of your sentences, lifted</h4>`));
    c.appendChild(el(`<p style="font-family:var(--serif);font-size:15.5px;line-height:1.6">${esc(r.upgrade)}</p>`));
  }
  return c;
}

function openEssay(id){
  const q = ESSAY_QS.find(x=>x.id===id);

  wrap.appendChild(back('Practice', () => { S.tab='practice'; render(); }));
  wrap.appendChild(el(`<div>${pill('essay')} <span class="pill ghost">${esc(q.yr)}</span>
    <h1 class="h-page" style="margin-top:8px;font-size:21px">Critical essay</h1></div>`));
  wrap.appendChild(el(`<div class="card"><p style="font-family:var(--serif);font-size:16.5px;line-height:1.58">${esc(q.q)}</p></div>`));
  wrap.appendChild(el(`<div class="card flat"><div class="eyebrow" style="margin-bottom:5px">Your prepared material</div><p style="font-size:14.5px;line-height:1.5">${esc(q.blocks)}</p></div>`));

  // timer
  const tbox = el(`<div class="card flat row"><div><div class="eyebrow">Exam timing</div><div class="timer" id="tmr">45:00</div></div><div style="flex:1"></div><button class="btn small secondary" id="tbtn">Start</button></div>`);
  wrap.appendChild(tbox);
  let left = 45*60, iv = null;
  const tmr = tbox.querySelector('#tmr'), tbtn = tbox.querySelector('#tbtn');
  const paint = () => { tmr.textContent = String(Math.floor(left/60)).padStart(2,'0') + ':' + String(left%60).padStart(2,'0'); tmr.classList.toggle('warn', left <= 300); };
  tbtn.onclick = () => {
    if(iv){ clearInterval(iv); iv=null; tbtn.textContent='Resume'; return; }
    tbtn.textContent = 'Pause';
    iv = setInterval(() => { left--; paint(); if(left<=0){ clearInterval(iv); iv=null; tbtn.textContent='Time'; toast('Time. Stop writing and bullet the rest.'); } }, 1000);
  };

  const plan = el(`<div class="card"><div class="eyebrow" style="margin-bottom:8px">Five-minute plan</div>
    <textarea class="answer" id="essay-plan" style="min-height:110px;font-family:var(--sans);font-size:15px" placeholder="Four claims, each with the quotation you will use.&#10;1.&#10;2.&#10;3.&#10;4."></textarea></div>`);
  wrap.appendChild(plan);

  const box = el(`<div class="card"><div class="row" style="margin-bottom:8px"><div class="eyebrow">Your essay</div><div style="flex:1"></div><span class="wordcount">0 words</span></div>

  const slot = el(`<div class="stack"></div>`); wrap.appendChild(slot);
  const btn = el(`<button class="btn brass full" data-ai-gate>Mark against the 20-mark grid</button>`);
  const fb = el(`<div class="card flat" data-ai-fallback hidden><div class="eyebrow" style="margin-bottom:6px">Marking by Claude unavailable here</div>
    <p style="font-size:14.5px;line-height:1.5">Mark yourself against the grid in the lesson “What the 20 marks actually reward”. Check in order: is every paragraph relevant to the question, is the analysis explaining effect rather than naming techniques, is there a judgement anywhere, and would a stranger understand every sentence first time?</p></div>`);
  btn.hidden = !SAMPLE;
  fb.hidden = SAMPLE !== null;
  slot.appendChild(btn); slot.appendChild(fb);

  btn.onclick = async () => {
    const txt = ta.value.trim();
    if(txt.split(/\s+/).filter(Boolean).length < 120){ toast('Write at least a couple of paragraphs first'); return; }
    btn.disabled = true;
    const out = el(`<div class="fb"><h4>Marking</h4><p class="sub" id="stream">Reading your essay against the grid…</p></div>`);
    slot.insertBefore(out, fb);
    try{
      const r = await mark({ kind:'Higher English critical essay (Section 2), drama — Hamlet', question:q.q, marks:20,
        model:'Reward: a line of thought sustained throughout; precise selection of evidence; analysis that explains the effect of dramatic techniques (soliloquy, dramatic irony, key scene, structure, conflict, characterisation); an evaluative stance; and explicit engagement with "contributes to your appreciation of the play as a whole". Penalise: plot retelling, technique-spotting without effect, and irrelevance to the question.',
        answer: txt });
      out.remove();
      slot.insertBefore(feedbackCard(r, 20, 'essay', q.q), fb);
      S.marks.push({ d:today(), s:'essay', m:Math.min(20,Number(r.mark)||0), of:20, q:'Critical essay · ' + q.yr }); save();
      btn.textContent = 'Mark again'; btn.disabled = false;
    }catch(e){
      out.remove(); const msg = aiErrCopy(e.code);
      if(msg) slot.insertBefore(el(`<div class="fb"><h4>Could not mark</h4><p style="font-size:14.5px">${esc(msg)}</p></div>`), fb);
      btn.disabled = false;
      if(e.code==='not_granted'||e.code==='sampling_disabled'){ btn.hidden = true; fb.hidden = false; }
    }
  };
  view.appendChild(wrap); scrollTo(0,0);
}

    <h1 class="h-page" style="margin-top:8px;font-size:21px">${esc(x.text)}</h1><p class="sub">${esc(x.setup)}</p></div>`));

  x.blocks.forEach(b => {
    wrap.appendChild(el(`<details class="acc" open><summary>${esc(b.ref)}</summary>
      <div class="accbody" style="padding-bottom:0"><div class="extract">${b.text.split('\n\n').map(p=>`<p>${esc(p)}</p>`).join('')}</div><div style="height:14px"></div></div></details>`));
  });

  x.questions.forEach(q => wrap.appendChild(questionCard(q, 'scottish', x.blocks[q.block]? x.blocks[q.block].text : x.blocks.map(b=>b.text).join('\n\n'), x.text)));
  view.appendChild(wrap); scrollTo(0,0);
}

/* ---------- RUAE practice ---------- */
function openRuae(id){
  const p = RUAE_PASSAGES.find(e=>e.id===id);
  view.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className='stack';
  wrap.appendChild(back('Practice', () => { S.tab='practice'; render(); }));
  wrap.appendChild(el(`<div>${pill('ruae')}<h1 class="h-page" style="margin-top:8px;font-size:22px">${esc(p.title)}</h1><p class="sub">${esc(p.byline)}</p></div>`));
  p.blocks.forEach(b => {
    wrap.appendChild(el(`<details class="acc" open><summary>${esc(b.ref)}</summary>
      <div class="accbody" style="padding-bottom:0"><div class="extract">${b.text.split('\n\n').map(t=>`<p>${esc(t)}</p>`).join('')}</div><div style="height:14px"></div></div></details>`));
  });
  p.questions.forEach((q,i) => wrap.appendChild(questionCard(q, 'ruae', p.blocks[i] ? p.blocks[i].text : '', p.title)));
